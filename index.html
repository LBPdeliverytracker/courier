<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courier Round Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0c12; color: #f1f3f9; font-family: monospace; min-height: 100vh; font-size: 13px; }
textarea { background: #1a1e2e; border: 1px solid #252a3d; color: #f1f3f9; font-family: monospace; font-size: 12px; border-radius: 6px; padding: 10px; outline: none; width: 100%; resize: vertical; }
textarea:focus { border-color: #3b82f6; }
input[type=text] { background: #1a1e2e; border: 1px solid #252a3d; color: #f1f3f9; font-family: monospace; font-size: 12px; border-radius: 5px; padding: 7px 10px; outline: none; width: 100%; }
input[type=text]:focus { border-color: #3b82f6; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const DARK = {
  bg:"#0a0c12", panel:"#13161f", card:"#1a1e2e", border:"#252a3d",
  blue:"#3b82f6", green:"#22c55e", red:"#ef4444", amber:"#f59e0b",
  text:"#f1f3f9", muted:"#6b7280", cyan:"#06b6d4",
};
const LIGHT = {
  bg:"#f5f6fa", panel:"#ffffff", card:"#eef0f6", border:"#d3d8e4",
  blue:"#2563eb", green:"#16a34a", red:"#dc2626", amber:"#b45309",
  text:"#11131a", muted:"#6b7280", cyan:"#0891b2",
};
const S = {...DARK};
function applyTheme(light) { Object.assign(S, light ? LIGHT : DARK); }
try { applyTheme(localStorage.getItem("dt_light")==="1"); } catch {}

const PARCEL_TYPE_LIST = ["Small Packet","Packet","Standard","Postable","Heavy","Heavy/Large","Hanging Garment","Collection"];

// Default rates (user can change in Settings)
const DEFAULT_RATES = {
  "Small Packet":0.61,"Packet":0.67,"Standard":0.89,
  "Postable":0.53,"Heavy":1.00,"Heavy/Large":1.00,
  "Hanging Garment":0.89,"Collection":0.00,
};

function loadRates() {
  try {
    const r = localStorage.getItem("delivery_rates");
    if (r) {
      const parsed = JSON.parse(r);
      // migrate old format {default, special} -> {rounds}
      if (parsed.rounds) return parsed;
      const rounds = {...(parsed.special||{})};
      return { rounds };
    }
  } catch {}
  return { rounds: {} };
}
function saveRates(r) {
  try { localStorage.setItem("delivery_rates", JSON.stringify(r)); } catch {}
}

function calcRound(roundNum, parcels, rateConfig) {
  const rates = (rateConfig?.rounds?.[roundNum]) || {};
  let total = 0;
  const lines = [];
  for (const [type, count] of Object.entries(parcels)) {
    if (!count) continue;
    const rate = rates[type] ?? 0;
    const sub = Math.round(count * rate * 100) / 100;
    lines.push({ type, count, rate, sub });
    total += sub;
  }
  return { total: Math.round(total * 100) / 100, lines };
}

function loadData() {
  try { const r = localStorage.getItem("delivery_tracker"); return r ? JSON.parse(r) : { periods: [] }; }
  catch { return { periods: [] }; }
}
function saveData(d) {
  try { localStorage.setItem("delivery_tracker", JSON.stringify(d)); } catch {}
}

function parseText(text) {
  const PARCEL_TYPES = ["Small Packet","Heavy/Large","Hanging Garment","Standard","Postable","Packet","Heavy","Collection"];
  const result = { date:null, distance_miles:null, duration_hours:null, duration_minutes:null, manifests:[], day_summary:null };
  const dateM = text.match(/Manifest Date\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (dateM) result.date = dateM[1];
  const distM = text.match(/estimated distance of ([\d.]+) mile/i);
  if (distM) result.distance_miles = parseFloat(distM[1]);
  const durM = text.match(/(\d+) hour\(s\) (\d+) minute/i);
  if (durM) { result.duration_hours = parseInt(durM[1]); result.duration_minutes = parseInt(durM[2]); }
  const blocks = text.split(/(?=Round Number)/i).filter(b => /Round Number/i.test(b));
  blocks.forEach(block => {
    const rnM = block.match(/Round Number\s*:?\s*(\d+)/i);
    if (!rnM) return;
    const roundNum = parseInt(rnM[1]);
    const parcels = {};
    PARCEL_TYPES.forEach(type => {
      const esc = type.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp("(?:^|\\n)[ \\t]*" + esc + "[ \\t]*:?[ \\t]*(\\d+)", "im");
      const m = block.match(re);
      parcels[type] = m ? parseInt(m[1]) : 0;
    });
    result.manifests.push({ round_number: roundNum, parcels });
  });
  const succM = text.match(/Successful deliveries\s*:?\s*(\d+)/i);
  const cfM = text.match(/Carry forward\s*:?\s*(\d+)/i);
  const failM = text.match(/Cannot deliver\s*:?\s*(\d+)/i);
  if (succM || cfM || failM) {
    result.day_summary = {
      successful: succM ? parseInt(succM[1]) : 0,
      carry_forward: cfM ? parseInt(cfM[1]) : 0,
      cannot_deliver: failM ? parseInt(failM[1]) : 0,
    };
  }
  if (result.manifests.length === 0) throw new Error("No Round Numbers found.");
  return result;
}

async function scanImages(files) {
  const toBase64 = file => new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const images = await Promise.all(Array.from(files).map(async f => ({
    type:"image", source:{type:"base64", media_type:f.type||"image/jpeg", data: await toBase64(f)}
  })));
  const prompt = `Extract delivery data from these courier app screenshots. Return ONLY valid JSON, no markdown.
Schema:
{"date":"DD/MM/YYYY","distance_miles":0,"duration_hours":0,"duration_minutes":0,"manifests":[{"round_number":123456,"parcels":{"Small Packet":0,"Packet":0,"Standard":0,"Postable":0,"Heavy":0,"Heavy/Large":0,"Hanging Garment":0,"Collection":0}}],"day_summary":{"successful":0,"carry_forward":0,"cannot_deliver":0}}
Rules: extract all Round Numbers and parcel counts; distance/duration from "estimated distance" line; day_summary from "Successful deliveries" line; date from "Manifest Date" field; set missing fields to 0; day_summary is null if no Day Summary screen present.`;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[...images,{type:"text",text:prompt}]}]})
  });
  if(!resp.ok) throw new Error("API "+resp.status+": "+(await resp.text()).slice(0,200));
  const data = await resp.json();
  const raw = data.content?.find(b=>b.type==="text")?.text||"";
  return JSON.parse(raw.replace(/```json|```/g,"").trim());
}

const fmt = v => "£" + Number(v||0).toFixed(2);
const pct = (a,b) => b > 0 ? ((a/b)*100).toFixed(1)+"%" : "—";
const dateKey = (s) => { const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? parseInt(m[3])*10000+parseInt(m[2])*100+parseInt(m[1]) : 0; };
// Live recompute a day's total from stored parcels + current rates
function dayAmount(d, rateConfig) {
  let t = 0;
  (d.rounds||[]).forEach(r => { t += calcRound(r.round, r.parcels, rateConfig).total; });
  return Math.round(t*100)/100;
}

function Btn({ children, onClick, color, style }) {
  const bg = color==="red"?S.red:color==="green"?S.green:color==="cyan"?S.cyan:S.blue;
  const tc = (color==="cyan"||color==="green")?"#000":"#fff";
  return <div onClick={onClick} style={{ background:bg, color:tc, padding:"11px 0", borderRadius:6, textAlign:"center", cursor:"pointer", fontWeight:600, fontSize:13, userSelect:"none", ...style }}>{children}</div>;
}

function Stat({ label, value, color }) {
  return (
    <div style={{ background:S.card, border:"1px solid "+S.border, borderRadius:8, padding:"10px 12px", flex:1, minWidth:80 }}>
      <div style={{ fontSize:9, color:S.muted, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{label}</div>
      <div style={{ fontSize:18, fontWeight:700, color:color||S.text }}>{value}</div>
    </div>
  );
}

function PeriodNameEditor({ name, onSave }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(name);
  if (!editing) return (
    <div style={{ display:"flex", alignItems:"center", gap:8, flex:1 }}>
      <span style={{ fontWeight:700, fontSize:16 }}>{name}</span>
      <div onClick={() => { setVal(name); setEditing(true); }}
        style={{ background:S.card, border:"1px solid "+S.border, color:S.muted, padding:"3px 10px", borderRadius:4, cursor:"pointer", fontSize:11 }}>✏ edit</div>
    </div>
  );
  return (
    <div style={{ display:"flex", gap:6, flex:1 }}>
      <input type="text" value={val} onChange={e => setVal(e.target.value)}
        style={{ flex:1, background:S.card, border:"1px solid "+S.blue, color:S.text, fontFamily:"monospace", fontSize:13, borderRadius:5, padding:"5px 10px", outline:"none" }}
        onKeyDown={e => { if(e.key==="Enter"&&val.trim()){onSave(val.trim());setEditing(false);} if(e.key==="Escape")setEditing(false); }}
        autoFocus />
      <div onClick={() => { if(val.trim()){onSave(val.trim());setEditing(false);} }}
        style={{ background:S.green, color:"#000", padding:"5px 12px", borderRadius:4, cursor:"pointer", fontSize:12, fontWeight:700 }}>✓</div>
      <div onClick={() => setEditing(false)}
        style={{ background:S.card, color:S.muted, padding:"5px 10px", borderRadius:4, cursor:"pointer", fontSize:12 }}>✕</div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(() => loadData());
  const [view, setView] = useState("home");
  const [activePi, setActivePi] = useState(null);
  const [toast, setToast] = useState(null);
  const [pasteText, setPasteText] = useState("");
  const [parseError, setParseError] = useState(null);
  const [parsed, setParsed] = useState(null);
  const [periodName, setPeriodName] = useState("");
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState(null);
  const [rateConfig, setRateConfig] = useState(() => loadRates());
  const [formKey, setFormKey] = useState(0);
  const [light, setLight] = useState(() => { try { return localStorage.getItem("dt_light")==="1"; } catch { return false; } });
  const [manualDate, setManualDate] = useState(""); // DD/MM only
  const [manualList, setManualList] = useState([]); // [{round:"", counts:{type:val}}]
  const [manualDay, setManualDay] = useState({successful:"",carry_forward:"",cannot_deliver:""});
  const [manualDist, setManualDist] = useState({miles:"",hours:""});
  const [fontScale, setFontScale] = useState(() => { try { return parseFloat(localStorage.getItem("dt_font"))||1; } catch { return 1; } });

  // keep palette + body bg in sync with theme
  applyTheme(light);
  useEffect(() => {
    try { localStorage.setItem("dt_light", light?"1":"0"); } catch {}
    document.body.style.background = S.bg;
    document.body.style.color = S.text;
  }, [light]);
  useEffect(() => { try { localStorage.setItem("dt_font", String(fontScale)); } catch {} }, [fontScale]);

  const showToast = (msg, ok=true) => { setToast({msg,ok}); setTimeout(()=>setToast(null),2500); };

  const persist = useCallback(nd => {
    saveData(nd);
    setData(nd);
  }, []);

  function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="delivery-backup.json"; a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if(!imported.periods) throw new Error();
        persist(imported);
        showToast("Imported "+imported.periods.length+" periods");
      } catch { showToast("Invalid file", false); }
    };
    reader.readAsText(file);
  }

  const activePeriod = data.periods[activePi];

  function pStats(p) {
    let total=0,success=0,failed=0,cf=0,amount=0,miles=0,mins=0;
    const types={};
    (p.days||[]).forEach(d => {
      total+=d.manifested||0; success+=d.successful||0; failed+=d.cannot_deliver||0;
      cf+=d.carry_forward||0; amount+=dayAmount(d,rateConfig); miles+=d.distance_miles||0;
      mins+=(d.duration_hours||0)*60+(d.duration_minutes||0);
      (d.rounds||[]).forEach(r => {
        Object.entries(r.parcels||{}).forEach(([t,c]) => { if(c>0) types[t]=(types[t]||0)+c; });
      });
    });
    return {total,success,failed,cf,amount,miles:Math.round(miles*10)/10,mins,types};
  }

  function doParse() {
    if(!pasteText.trim()) return;
    setParseError(null); setParsed(null);
    try { const r=parseText(pasteText); setParsed(r); setView("confirm"); }
    catch(e) { setParseError("Parse failed: "+e.message); }
  }

  async function handleScan(files) {
    if(!files||!files.length) return;
    setScanning(true); setScanError(null); setParsed(null);
    try {
      const result = await scanImages(files);
      setParsed(result);
      setView("confirm");
    } catch(e) { setScanError("Scan failed: "+e.message); }
    setScanning(false);
  }

  function saveDay() {
    if(!parsed?.date){showToast("No date found",false);return;}
    let manifested=0, amount=0;
    const rounds=[];
    (parsed.manifests||[]).forEach(m => {
      const {total,lines}=calcRound(m.round_number,m.parcels,rateConfig);
      const cnt=Object.values(m.parcels).reduce((a,v)=>a+(v||0),0);
      manifested+=cnt; amount+=total;
      rounds.push({round:m.round_number,parcels:m.parcels,subtotal:total,lines});
    });
    const dayObj = {
      date:parsed.date, manifested,
      successful:parsed.day_summary?.successful||0,
      carry_forward:parsed.day_summary?.carry_forward||0,
      cannot_deliver:parsed.day_summary?.cannot_deliver||0,
      distance_miles:parsed.distance_miles||0,
      duration_hours:parsed.duration_hours||0,
      duration_minutes:parsed.duration_minutes||0,
      amount:Math.round(amount*100)/100, rounds, savedAt:Date.now(),
    };
    const periods = data.periods.map((p,pi) => {
      if(pi!==activePi) return p;
      const days=[...p.days.filter(d=>d.date!==dayObj.date),dayObj].sort((a,b)=>dateKey(a.date)-dateKey(b.date));
      return {...p,days};
    });
    persist({...data,periods});
    showToast("Saved!");
    setPasteText(""); setParsed(null);
    setView("period");
  }

  function avgMilesHours() {
    const p = data.periods[activePi];
    let miles=0, mins=0, n=0;
    (p?.days||[]).forEach(d => {
      if((d.distance_miles||0)>0){ miles+=d.distance_miles; mins+=(d.duration_hours||0)*60+(d.duration_minutes||0); n++; }
    });
    if(n===0) return null;
    return { miles: Math.round((miles/n)*100)/100, hours: Math.round((mins/n)/60*100)/100 };
  }

  function initManual() {
    const blank={}; PARCEL_TYPE_LIST.forEach(t=>blank[t]="");
    setManualDate("");
    setManualList([{round:"", counts:{...blank}}]);
    setManualDay({successful:"",carry_forward:"",cannot_deliver:""});
    setManualDist({miles:"",hours:""});
  }

  function saveManual() {
    // accept DDMM (digits only) or DD/MM
    let raw = manualDate.trim().replace(/\D/g,""); // strip non-digits -> e.g. 0506
    let dd, mm;
    if(raw.length===3){ dd=raw.slice(0,1); mm=raw.slice(1); }      // 506 -> 5/06
    else if(raw.length===4){ dd=raw.slice(0,2); mm=raw.slice(2); } // 0506 -> 05/06
    else { showToast("Enter date as DDMM, e.g. 0506", false); return; }
    const di=parseInt(dd), mi=parseInt(mm);
    if(di<1||di>31||mi<1||mi>12){ showToast("Invalid date", false); return; }
    const yr = new Date().getFullYear();
    const fullDate = String(di).padStart(2,"0")+"/"+String(mi).padStart(2,"0")+"/"+yr;

    const valid = manualList.filter(r=>/^\d+$/.test((r.round||"").trim()));
    if(valid.length===0){ showToast("Enter at least one Round number", false); return; }

    let manifested=0, amount=0;
    const rounds=[];
    valid.forEach(r => {
      const rn=parseInt(r.round.trim());
      const parcels={};
      PARCEL_TYPE_LIST.forEach(t => { parcels[t]=parseInt(r.counts[t])||0; });
      const {total,lines}=calcRound(rn,parcels,rateConfig);
      const cnt=Object.values(parcels).reduce((a,v)=>a+(v||0),0);
      manifested+=cnt; amount+=total;
      rounds.push({round:rn,parcels,subtotal:total,lines});
    });

    // miles/hours: use entered, else average, else 0
    const avg = avgMilesHours();
    const miles = manualDist.miles!=="" ? parseFloat(manualDist.miles) : (avg?avg.miles:0);
    const hoursDec = manualDist.hours!=="" ? parseFloat(manualDist.hours) : (avg?avg.hours:0);
    const dh = Math.floor(hoursDec);
    const dmins = Math.round((hoursDec-dh)*60);

    const dayObj = {
      date:fullDate, manifested,
      successful:parseInt(manualDay.successful)||0,
      carry_forward:parseInt(manualDay.carry_forward)||0,
      cannot_deliver:parseInt(manualDay.cannot_deliver)||0,
      distance_miles:Math.round((miles||0)*100)/100,
      duration_hours:dh||0, duration_minutes:dmins||0,
      amount:Math.round(amount*100)/100, rounds, savedAt:Date.now(),
    };
    const periods = data.periods.map((p,pi) => {
      if(pi!==activePi) return p;
      const days=[...p.days.filter(d=>d.date!==dayObj.date),dayObj].sort((a,b)=>dateKey(a.date)-dateKey(b.date));
      return {...p,days};
    });
    persist({...data,periods});
    showToast("Saved!");
    setView("period");
  }

  function deleteDay(di) {
    const periods=data.periods.map((p,pi)=>pi!==activePi?p:{...p,days:p.days.filter((_,i)=>i!==di)});
    persist({...data,periods}); showToast("Deleted");
  }

  function deletePeriod() {
    persist({...data,periods:data.periods.filter((_,i)=>i!==activePi)});
    showToast("Deleted"); setView("home");
  }

  const wrap = children => (
    <div style={{maxWidth:680,margin:"0 auto",padding:"22px 14px",background:S.bg,color:S.text,minHeight:"100vh",zoom:fontScale}}>
      {toast && <div style={{position:"fixed",top:14,right:14,background:toast.ok?S.green:S.red,color:"#fff",padding:"9px 18px",borderRadius:7,fontWeight:700,zIndex:9999,fontSize:12}}>{toast.msg}</div>}
      {children}
    </div>
  );

  const topBar = (title, back) => (
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
      {back && <div onClick={back} style={{background:S.card,border:"1px solid "+S.border,color:S.muted,padding:"6px 14px",borderRadius:5,cursor:"pointer"}}>← back</div>}
      <span style={{fontWeight:700,fontSize:16}}>{title}</span>
    </div>
  );

  // HELP VIEW
  if (view==="help") {
    const card = {background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"14px",marginBottom:12};
    const h = {fontWeight:700,color:S.cyan,fontSize:14,marginBottom:8};
    const p = {fontSize:12.5,color:S.text,lineHeight:1.6,marginBottom:6};
    const mut = {fontSize:11.5,color:S.muted,lineHeight:1.6};
    const codebox = {background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"10px",fontSize:11,color:S.muted,lineHeight:1.5,marginTop:6,whiteSpace:"pre-wrap"};
    return wrap(<>
      {topBar("❓ Help & Guide", ()=>setView("home"))}

      <a href="mailto:lbpdeliverytracker@outlook.com?subject=Delivery%20Tracker%20-%20Help" style={{textDecoration:"none"}}>
        <div style={{background:S.cyan+"18",border:"1px solid "+S.cyan+"55",borderRadius:8,padding:"12px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>📧</span>
          <div>
            <div style={{fontWeight:700,color:S.cyan,fontSize:13}}>Need help? Contact me</div>
            <div style={{fontSize:11,color:S.muted}}>Tap to email lbpdeliverytracker@outlook.com</div>
          </div>
        </div>
      </a>

      <div style={card}>
        <div style={h}>1 · First-time setup</div>
        <div style={p}>Go to <b>Settings — Rounds &amp; Rates</b> and tap <b>+ Add Round</b>. Enter your Round Number, then tap <b>⚡ Auto-fill from Standard rate</b> and type your Standard Parcel rate — the other parcel types are worked out automatically from Evri's pay bands. Edit any if yours differ. Repeat for each round you run.</div>
      </div>

      <div style={card}>
        <div style={h}>2 · Create a Period</div>
        <div style={p}>On the home screen tap <b>+ New Period</b> and give it a name (e.g. your pay period dates). A period holds all the days inside it and shows your totals.</div>
      </div>

      <div style={card}>
        <div style={h}>3 · Add a day's data</div>
        <div style={p}>You'll take 3 screenshots during a normal working day. Just copy the text from each and paste them together into one box:</div>

        <div style={h}>4 · No manifest? Use Manual Entry</div>
        <div style={p}>Sometimes Evri's system has no manifest in the morning, so you get no Manifest Summary screenshots. In that case, wait until the figures appear in the official Evri app under <b>My Pay → Estimated pay → by round</b>, then enter them by hand.</div>
        <div style={p}>Open your period and tap <b>✏️ Manual Entry</b>. Type the <b>date</b> as 4 digits (e.g. 0506 for 5 June — no slash needed). For each round, type the <b>Round number</b> and the quantity of each parcel type. Tap <b>+ Round</b> if you ran more than one.</div>

  // SETTINGS VIEW
  if (view==="settings") {
    const rounds = rateConfig.rounds || {};
    const updateRate = (round, type, val) => {
      const nc = {...rateConfig, rounds:{...rounds, [round]:{...(rounds[round]||{}), [type]: parseFloat(val)||0}}};
      setRateConfig(nc); saveRates(nc);
    };
    const autoFill = (round) => {
      const std = prompt("Enter your Standard Parcel rate (£), e.g. 1.00\nOther types are auto-calculated from Evri's % bands and minimums. Edit any after.");
      const base = parseFloat(std);
      if (!base || base<=0) { if(std!==null) showToast("Enter a valid number", false); return; }
      const r2 = v => Math.round(v*100)/100;
      const filled = {
        "Small Packet":   Math.max(r2(base*0.69), 0.35),
        "Packet":         Math.max(r2(base*0.75), 0.40),
        "Standard":       r2(base),
        "Postable":       Math.max(r2(base*0.60), 0.30),
        "Heavy":          Math.max(r2(base), 1.00),
        "Heavy/Large":    Math.max(r2(base), 1.00),
        "Hanging Garment":r2(base),
        "Collection":     r2(base*0.80),
      };
      const nc = {...rateConfig, rounds:{...rounds, [round]:filled}};
      setRateConfig(nc); saveRates(nc); setFormKey(k=>k+1); showToast("Auto-filled — edit any if needed");
    };
    const addRound = () => {
      const rn = prompt("Enter your Round Number (e.g. 123456):");
      if (!rn || !/^\d+$/.test(rn.trim())) { if(rn) showToast("Numbers only", false); return; }
      const key = rn.trim();
      if (rounds[key]) { showToast("Round already exists", false); return; }

      </div>
    </>);

        <span style={{color:S.amber,fontWeight:700,fontSize:20}}>{fmt(totalAmount)}</span>

    </>);
  }

  // DAY DETAIL
  if (view.startsWith("day_") && activePeriod) {
    const di=parseInt(view.split("_")[1]);
    const d=activePeriod.days[di];
    if(!d){setView("period");return null;}
    return wrap(<>
      {topBar("📅 "+d.date, ()=>setView("period"))}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <Stat label="Manifest" value={d.manifested} />
        <Stat label="Delivered" value={d.successful} color={S.green} />
        <Stat label="CF" value={d.carry_forward} color={S.amber} />
        <Stat label="Collection" value={(d.rounds||[]).reduce((a,r)=>a+(r.parcels?.Collection||0),0)} color={S.cyan} />
        <Stat label="Earned" value={fmt(dayAmount(d,rateConfig))} color={S.amber} />
        {d.distance_miles>0 && <Stat label="Miles" value={d.distance_miles+"mi"} color={S.cyan} />}
        {d.duration_hours>0 && <Stat label="Drive" value={d.duration_hours+"h"+d.duration_minutes+"m"} color={S.cyan} />}
      </div>
      {(d.rounds||[]).map((r,i)=>{
        const live=calcRound(r.round,r.parcels,rateConfig);
        return (
        <div key={i} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <b>Round {r.round}</b><span style={{color:S.amber}}>{fmt(live.total)}</span>
          </div>
          {live.lines.map((l,j)=>(
            <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:S.muted,marginBottom:3}}>
              <span>{l.type}</span>
              <span>{l.count} × £{l.rate.toFixed(2)} = <b style={{color:S.text}}>£{l.sub.toFixed(2)}</b></span>
            </div>
          ))}
        </div>
      );})}
    </>);
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
