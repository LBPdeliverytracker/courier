const DEFAULT_RATES = {
  "Small Packet":0.61,"Packet":0.67,"Standard":0.89,
  "Postable":0.53,"Heavy":1.00,"Heavy/Large":1.00,
  "Hanging Garment":0.89,"Collection":0.00,
};

function loadRates() {
  try {
    const r = localStorage.getItem("delivery_rates");
    if (r) {
      const parsed = JSON.parse(r);
      // migrate old format {default, special} -> {rounds}
      if (parsed.rounds) return { sundayRounds:{}, ...parsed };
      const rounds = {...(parsed.special||{})};
      return { rounds, sundayRounds:{} };
    }
  } catch {}
  return { rounds: {}, sundayRounds: {} };
}
function saveRates(r) {
  try { localStorage.setItem("delivery_rates", JSON.stringify(r)); } catch {}
}

function calcRound(roundNum, parcels, rateConfig, sunday) {
  const rates = (sunday ? rateConfig?.sundayRounds?.[roundNum] : rateConfig?.rounds?.[roundNum]) || {};
  let total = 0;
  const lines = [];
  for (const [type, count] of Object.entries(parcels)) {
    if (!count) continue;
    const rate = rates[type] ?? (sunday ? 1 : 0);
    const sub = Math.round(count * rate * 100) / 100;
    lines.push({ type, count, rate, sub });
    total += sub;
  }
  return { total: Math.round(total * 100) / 100, lines };
}

function loadData() {
  try { const r = localStorage.getItem("delivery_tracker"); return r ? JSON.parse(r) : { periods: [] }; }
  catch { return { periods: [] }; }
}
function saveData(d) {
  try { localStorage.setItem("delivery_tracker", JSON.stringify(d)); } catch {}
}

function parseText(rawText) {
  // Normalise common copy/OCR glitches: lone letter O used as zero (e.g. "Cannot deliver: O")
  const text = rawText
    .replace(/:\s*O\b/g, ": 0")
    .replace(/\u00A0/g, " ");
  const PARCEL_TYPES = ["Small Packet","Heavy/Large","Hanging Garment","Standard","Postable","Packet","Heavy","Collection"];
  const result = { date:null, distance_miles:null, duration_hours:null, duration_minutes:null, manifests:[], day_summary:null };
  const dateM = text.match(/Manifest Date\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (dateM) result.date = dateM[1];
  const distM = text.match(/estimated distance of ([\d.]+)\s*mile/i);
  if (distM) result.distance_miles = parseFloat(distM[1]);
  const durM = text.match(/(\d+)\s*hour\(s\)\s*(\d+)\s*minute/i);
  if (durM) { result.duration_hours = parseInt(durM[1]); result.duration_minutes = parseInt(durM[2]); }
  // Round number may be "Round Number: 123", "RoundNumber:123", "Round 123", etc.
  const roundRe = /Round\s*(?:Number)?\s*:?\s*(\d{3,})/ig;
  // Split into blocks at each round marker so parcels stay with their round
  const markers = [];
  let mm;
  while ((mm = roundRe.exec(text)) !== null) {
    markers.push({ idx: mm.index, end: roundRe.lastIndex, round: parseInt(mm[1]) });
  }
  // Helper: count parcel types within a segment using a "consume" approach —
  // match longest type names first and blank them out so e.g. "Packet" can't
  // re-match the tail of "Small Packet", and "Heavy" can't match "Heavy/Large".
  const TYPE_ORDER = ["Small Packet","Heavy/Large","Hanging Garment","Postable","Standard","Collection","Packet","Heavy"];
  if (markers.length > 0) {
    markers.forEach((mk, i) => {
      const segStart = mk.end;
      const segEnd = (i+1 < markers.length) ? markers[i+1].idx : text.length;
      let seg = text.slice(segStart, segEnd);
      const cut = seg.search(/estimated distance|Successful deliveries|Service Offers|Postcode/i);
      if (cut !== -1) seg = seg.slice(0, cut);
      const parcels = {};
      PARCEL_TYPES.forEach(t => parcels[t] = 0);
      let work = seg;
      TYPE_ORDER.forEach(type => {
        const esc = type.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(esc + "\\s*:?\\s*(\\d+)", "i");
        const m = work.match(re);
        if (m) {
          parcels[type] = parseInt(m[1]);
          work = work.slice(0, m.index) + " ".repeat(m[0].length) + work.slice(m.index + m[0].length);
        }
      });
      result.manifests.push({ round_number: mk.round, parcels });
    });
  }
  const succM = text.match(/Successful deliveries\s*:?\s*(\d+)/i);
  const cfM = text.match(/Carry forward\s*:?\s*(\d+)/i);
  const failM = text.match(/Cannot deliver\s*:?\s*(\d+)/i);
  const succColM = text.match(/Successful collections?\s*:?\s*(\d+)/i);
  if (succM || cfM || failM) {
    result.day_summary = {
      successful: succM ? parseInt(succM[1]) : 0,
      carry_forward: cfM ? parseInt(cfM[1]) : 0,
      cannot_deliver: failM ? parseInt(failM[1]) : 0,
      successful_collections: succColM ? parseInt(succColM[1]) : 0,
    };
  }
  if (result.manifests.length === 0) throw new Error("No Round Numbers found.");
  return result;
}

const fmt = v => "£" + Number(v||0).toFixed(2);
const pct = (a,b) => b > 0 ? ((a/b)*100).toFixed(1)+"%" : "—";
const dateKey = (s) => { const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? parseInt(m[3])*10000+parseInt(m[2])*100+parseInt(m[1]) : 0; };
// Find EVRi deadlines within the next `window` days (and today)
function upcomingEvriEvents(windowDays) {
  const today = new Date(); today.setHours(0,0,0,0);
  const labels = { invoice:"📄 Invoice available", pay:"💷 Payday", end:"📅 Period ends" };
  const out = [];
  Object.entries(EVRI_CALENDAR).forEach(([p,dates]) => {
    Object.entries(dates).forEach(([kind,iso]) => {
      const d = new Date(iso+"T00:00:00"); d.setHours(0,0,0,0);
      const diff = Math.round((d-today)/86400000);
      if (diff>=0 && diff<=windowDays) out.push({ period:p, kind, iso, diff, label:labels[kind] });
    });
  });
  return out.sort((a,b)=>a.diff-b.diff);
}
// Live recompute a day's total from stored parcels + current rates
function dayAmount(d, rateConfig) {
  let t = 0;
  (d.rounds||[]).forEach(r => { t += calcRound(r.round, r.parcels, rateConfig, d.isSunday).total; });
  t += Number(d.topUp)||0;
  return Math.round(t*100)/100;
}

        setRefPopup(null);
        try { window.history.pushState({ d: viewStack.current.length }, ""); } catch {}
        return;
      }
      const stack = viewStack.current;
      if (stack.length > 1) {
        stack.pop();
        skipPush.current = true;
        setView(stack[stack.length - 1]);
      } else {
        setView("home");
      }
      try { window.history.pushState({ d: viewStack.current.length }, ""); } catch {}
    };
    try { window.history.pushState({ d: 1 }, ""); } catch {}
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  useEffect(() => { refPopupRef.current = !!refPopup; }, [refPopup]);

    const stack = viewStack.current;
    if (skipPush.current) { skipPush.current = false; return; }
    if (view === "home") {

        const imported = JSON.parse(ev.target.result);
        // v2 backup: { version, data, rates, enquiries }. Old backup: the data object itself.
        const isWrapped = imported && imported.data && imported.data.periods;
        const restoredData = isWrapped ? imported.data : imported;
        if(!restoredData || !restoredData.periods) throw new Error();
        persist(restoredData);

        // rates — ensure rounds + sundayRounds both exist so Sunday calc never breaks
        let ratesMsg = "";
        if(imported.rates && imported.rates.rounds){
          const r = { rounds:{}, sundayRounds:{}, ...imported.rates };

          setRateConfig(r); saveRates(r);

          saveEnquiries(imported.enquiries);

    let total=0,success=0,failed=0,cf=0,amount=0,miles=0,mins=0,collections=0;

      cf+=d.carry_forward||0; amount+=dayAmount(d,rateConfig); miles+=d.distance_miles||0;

        hasSunday=true;

          const cnt=Object.values(r.parcels||{}).reduce((a,v)=>a+(v||0),0);
          sundayParcels+=cnt;
          // enhancement = Sunday-rate pay minus weekday-rate pay for the same parcels
          const sun=calcRound(r.round,r.parcels,rateConfig,true).total;
          const wk=calcRound(r.round,r.parcels,rateConfig,false).total;
          sundayEnh += (sun-wk);
        });

      (d.rounds||[]).forEach(r => {
        Object.entries(r.parcels||{}).forEach(([t,c]) => { if(c>0) types[t]=(types[t]||0)+c; });
      });

    return { miles: Math.round((miles/n)*100)/100, hours: Math.round((mins/n)/60*100)/100 };

    const d = activePeriod?.days?.[di];
    if(!d) return;
    // date DD/MM/YYYY -> DDMM for the manual input
    const dm = (d.date||"").match(/(\d{2})\/(\d{2})/);
    setManualDate(dm ? dm[1]+dm[2] : "");
    const list = (d.rounds||[]).map(r => {
      const counts={}; PARCEL_TYPE_LIST.forEach(t=>counts[t]= r.parcels?.[t] ? String(r.parcels[t]) : "");
      return { round:String(r.round), counts };
    });
    setManualList(list.length?list:[{round:"",counts:(()=>{const b={};PARCEL_TYPE_LIST.forEach(t=>b[t]="");return b;})()}]);
    setManualDay({
      successful: d.successful?String(d.successful):"",
      carry_forward: d.carry_forward?String(d.carry_forward):"",
      cannot_deliver: d.cannot_deliver?String(d.cannot_deliver):"",
    });
    const hoursDec = (d.duration_hours||0) + (d.duration_minutes||0)/60;
    setManualDist({ miles: d.distance_miles?String(d.distance_miles):"", hours: hoursDec?String(Math.round(hoursDec*100)/100):"" });
    setDayIsSunday(!!d.isSunday);
    setDayTopUp((Number(d.topUp)||0)>0 ? String(d.topUp) : "");
    setDayTopUpLabel(d.topUpLabel||"");
    setShowTopUp((Number(d.topUp)||0)>0);
    setView("manual");
  }

  function saveManual() {
    // accept DDMM (digits only) or DD/MM
    let raw = manualDate.trim().replace(/\D/g,""); // strip non-digits -> e.g. 0506
    let dd, mm;
    if(raw.length===3){ dd=raw.slice(0,1); mm=raw.slice(1); }      // 506 -> 5/06
    else if(raw.length===4){ dd=raw.slice(0,2); mm=raw.slice(2); } // 0506 -> 05/06
    else { showToast("Enter date as DDMM, e.g. 0506", false); return; }
    const di=parseInt(dd), mi=parseInt(mm);
    if(di<1||di>31||mi<1||mi>12){ showToast("Invalid date", false); return; }
    const yr = new Date().getFullYear();
    const fullDate = String(di).padStart(2,"0")+"/"+String(mi).padStart(2,"0")+"/"+yr;

    const valid = manualList.filter(r=>/^\d+$/.test((r.round||"").trim()));
    if(valid.length===0){ showToast("Enter at least one Round number", false); return; }

    // block save if any round has no rate set in Settings
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const missing = valid.map(r=>r.round.trim()).filter(rn=>!knownRounds.includes(rn));
    if(missing.length>0){
      showToast("Round "+missing.join(", ")+" has no rate — add it in Settings first", false);
      return;
    }

    let manifested=0, amount=0;
    const rounds=[];
    valid.forEach(r => {
      const rn=parseInt(r.round.trim());
      const parcels={};
      PARCEL_TYPE_LIST.forEach(t => { parcels[t]=parseInt(r.counts[t])||0; });
      const {total,lines}=calcRound(rn,parcels,rateConfig,dayIsSunday);
      const cnt=Object.values(parcels).reduce((a,v)=>a+(v||0),0);
      manifested+=cnt; amount+=total;
      rounds.push({round:rn,parcels,subtotal:total,lines});
    });

    // miles/hours: use entered, else average, else 0
    const avg = avgMilesHours();
    const miles = manualDist.miles!=="" ? parseFloat(manualDist.miles) : (avg?avg.miles:0);
    const hoursDec = manualDist.hours!=="" ? parseFloat(manualDist.hours) : (avg?avg.hours:0);
    const dh = Math.floor(hoursDec);
    const dmins = Math.round((hoursDec-dh)*60);
    const topUpNum = Number(dayTopUp)||0;
    amount += topUpNum;

    const dayObj = {
      date:fullDate, manifested,
      successful:parseInt(manualDay.successful)||0,
      carry_forward:parseInt(manualDay.carry_forward)||0,
      cannot_deliver:parseInt(manualDay.cannot_deliver)||0,
      distance_miles:Math.round((miles||0)*100)/100,
      duration_hours:dh||0, duration_minutes:dmins||0,
      isSunday:dayIsSunday, topUp:topUpNum, topUpLabel:dayTopUpLabel.trim(),
      amount:Math.round(amount*100)/100, rounds, savedAt:Date.now(),
    };
    const periods = data.periods.map((p,pi) => {
      if(pi!==activePi) return p;
      const days=[...p.days.filter(d=>d.date!==dayObj.date),dayObj].sort((a,b)=>dateKey(a.date)-dateKey(b.date));
      return {...p,days};
    });
    persist({...data,periods});
    showToast("Saved!");
    setDayIsSunday(false); setDayTopUp(""); setDayTopUpLabel(""); setShowTopUp(false);
    setView("period");
  }

  function deleteDay(di) {
    const periods=data.periods.map((p,pi)=>pi!==activePi?p:{...p,days:p.days.filter((_,i)=>i!==di)});
    persist({...data,periods}); showToast("Deleted");
  }

  function deletePeriod() {
    persist({...data,periods:data.periods.filter((_,i)=>i!==activePi)});
    showToast("Deleted"); setView("home");

  const wrap = children => {

      : { zoom:fontScale };

    <div style={{...outer}}>

    return wrap(<>
      {topBar("❓ Help & Guide", ()=>setView("home"))}

      <a href="mailto:lbpdeliverytracker@outlook.com?subject=Delivery%20Tracker%20-%20Help" style={{textDecoration:"none"}}>

          <span style={{fontSize:18}}>📧</span>

      <div style={card}>
        <div style={h}>📸 1 · Take 3 screenshots each day</div>

      <div style={card}>

        <div style={p}>Open your period → <Key>📋 Paste Manifest Text</Key>. Paste all 3 screenshots' text into one box → <Key>PARSE →</Key> → <Key>✓ SAVE</Key>.</div>
        <div style={{...mut,marginTop:6,marginBottom:4,fontWeight:700,color:S.text}}>What you paste:</div>
        <div style={codebox}>{`Round Number: 100200

        <div style={{...p,marginTop:8}}>→ <Hi>no need to tidy it</Hi> — the app finds what it needs.</div>
        <div style={{background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"10px",marginTop:8}}>
          <div style={mut}><Hi>No manifest in the morning?</Hi> Use <Key>✏️ Manual Entry</Key> instead — type the date (e.g. 0506), round number and parcels by hand. Leave Miles/Hours blank and the app uses your average.</div>
        </div>
        <div style={{background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"10px",marginTop:8}}>
          <div style={mut}>Before saving you can tick <Key>☀ Sunday</Key> (uses your Sunday rates) or tap <Key>+ Top up</Key> to add a bonus like RTD pay. Saved a day with a mistake? Open it and tap <Key>✏ edit</Key> to fix it.</div>
        </div>
      </div>

      <div style={card}>
        <div style={h}>📊 5 · See your results</div>
        <div style={p}>Your totals and pay calculate <Hi>automatically</Hi>. Change a rate in <Key>⚙ Settings</Key> and <Hi>every saved day updates instantly</Hi>.</div>
      </div>

      <div style={card}>
        <div style={h}>🧾 6 · Check your invoice</div>
        <div style={p}><Key>🧾 Invoice Checker</Key> → pick the round → enter the <Hi>period number</Hi>, parcel counts and <Hi>what you were paid</Hi>.</div>
        <div style={p}>→ it shows any <Hi>shortfall</Hi> and gives you a claim message to copy.</div>
        <div style={{...mut,marginTop:6,marginBottom:4,fontWeight:700,color:S.text}}>Your invoice looks like this:</div>
        <img alt="Invoice example" src={SHOT_INVOICE} style={{width:"100%",maxWidth:340,display:"block",margin:"4px auto 10px",borderRadius:8,border:"1px solid "+S.border,background:"#fff"}} />
        <div style={{...mut,marginBottom:8}}>Enter each parcel count and the paid total (<Hi>£347.28</Hi> here). If your rates say it should be <Hi>£378.28</Hi>, the app flags a <Hi>£31.00 shortfall</Hi> and writes the claim for you.</div>
        <div style={{background:S.amber+"18",border:"1px solid "+S.amber+"66",borderRadius:6,padding:"9px 12px",marginTop:8}}>
          <div style={{fontSize:12,color:S.amber,fontWeight:700}}>⚠ Check each round separately — never combine them.</div>
        </div>
        <div style={{...mut,marginTop:8}}>Figures are a <Hi>guideline only</Hi>. Real pay can differ (unmanifested parcels, wrong banding, returns, CNA). Raise genuine shortfalls through the official pay query process.</div>
      </div>

      <div style={card}>
        <div style={h}>🔧 7 · Other bits</div>
        <div style={{...mut,marginBottom:6}}>• <Key>⬇ Backup</Key> / <Key>⬆ Restore</Key> — your data lives only on this phone, so back up now and then.</div>
        <div style={{...mut,marginBottom:6}}>• <Key>Text − / +</Key> and <Key>Light / Dark</Key> — adjust the display.</div>
        <div style={{...mut,marginBottom:0}}>• <Hi>🔒 Privacy</Hi> — your delivery data stays on your phone. The app only uses Google Analytics for anonymous stats. Nothing else is uploaded.</div>
      </div>
    </>);
  }

  // SETTINGS VIEW
  if (view==="settings") {
    const rounds = rateConfig.rounds || {};
    const r2 = v => Math.round(v*100)/100;
    // compute all 8 rates from a Standard base, per Evri bands + minimums
    const deriveFromStandard = (base) => ({
      "Small Packet":   Math.max(r2(base*0.69), 0.35),
      "Packet":         Math.max(r2(base*0.75), 0.40),
      "Standard":       r2(base),
      "Postable":       Math.max(r2(base*0.60), 0.30),
      "Heavy":          Math.max(r2(base), 1.00),
      "Heavy/Large":    Math.max(r2(base), 1.00),
      "Hanging Garment":r2(base),
      "Collection":     r2(base*0.80),
    });
    const updateRate = (round, type, val) => {
      const nc = {...rateConfig, rounds:{...rounds, [round]:{...(rounds[round]||{}), [type]: parseFloat(val)||0}}};
      setRateConfig(nc); saveRates(nc);
    };
    // typing the Standard rate auto-fills every other type (still editable after)
    const setStandard = (round, val) => {
      const base = parseFloat(val);
      if (!base || base<=0) { updateRate(round, "Standard", val); return; }
      const filled = deriveFromStandard(base);
      // keep the user's exact typed Standard value (don't round-trip "1.0" -> 1)
      filled["Standard"] = val;
      const nc = {...rateConfig, rounds:{...rounds, [round]:filled}};
      setRateConfig(nc); saveRates(nc); setOtherKey(k=>k+1);
    };
    const addRound = () => {
      const rn = prompt("Enter your Round Number (e.g. 123456):");
      if (!rn || !/^\d+$/.test(rn.trim())) { if(rn) showToast("Numbers only", false); return; }
      const key = rn.trim();
      if (rounds[key]) { showToast("Round already exists", false); return; }
      const blank = {}; PARCEL_TYPE_LIST.forEach(t=>blank[t]=0);
      const nc = {...rateConfig, rounds:{...rounds, [key]:blank}};
      setRateConfig(nc); saveRates(nc); showToast("Added round "+key);
    };
    const removeRound = (round) => {
      const r = {...rounds}; delete r[round];
      const sr = {...(rateConfig.sundayRounds||{})}; delete sr[round];
      const nc = {...rateConfig, rounds:r, sundayRounds:sr};
      setRateConfig(nc); saveRates(nc);
    };
    const sundayRounds = rateConfig.sundayRounds || {};
    // Sunday rates default to £1 for every type until the user changes them
    const sundayRateFor = (round, type) => {
      const sr = sundayRounds[round];
      return (sr && sr[type]!=null) ? sr[type] : 1;
    };
    const updateSundayRate = (round, type, val) => {
      const base = sundayRounds[round] || {};
      const nc = {...rateConfig, sundayRounds:{...sundayRounds, [round]:{...base, [type]: parseFloat(val)||0}}};
      setRateConfig(nc); saveRates(nc);
    };
    // flat rate: set every Sunday type to the same value at once
    const setAllSunday = (round, val) => {
      const v = parseFloat(val);
      const filled = {};
      PARCEL_TYPE_LIST.forEach(t => { filled[t] = (!v||v<=0) ? 0 : v; });
      const nc = {...rateConfig, sundayRounds:{...sundayRounds, [round]:filled}};
      setRateConfig(nc); saveRates(nc); setSundayKey(k=>k+1);
    };
    // typing the Sunday Standard rate auto-fills every other Sunday type
    const setStandardSunday = (round, val) => {
      const base = parseFloat(val);
      if (!base || base<=0) { updateSundayRate(round, "Standard", val); return; }
      const filled = deriveFromStandard(base);
      filled["Standard"] = val;
      const nc = {...rateConfig, sundayRounds:{...sundayRounds, [round]:filled}};
      setRateConfig(nc); saveRates(nc); setSundayKey(k=>k+1);
    };
    const roundKeys = Object.keys(rounds);
    const inp = {width:90,background:S.bg,border:"1px solid "+S.border,color:S.text,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none",textAlign:"right"};
    const OTHER_TYPES = PARCEL_TYPE_LIST.filter(t=>t!=="Standard");
    return wrap(<>
      {topBar("⚙ Settings", ()=>setView("home"))}

      <div onClick={addRound} style={{background:S.cyan,color:"#000",padding:"13px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:14,textAlign:"center",marginBottom:14}}>+ Add Round</div>

      <div style={{fontSize:11,color:S.muted,marginBottom:14,lineHeight:1.5}}>Just type your <b style={{color:S.text}}>Standard Parcel rate</b> — every other type fills in automatically from Evri's pay bands. You can still edit any of them below.</div>

      {roundKeys.length===0 && <div style={{background:S.amber+"15",border:"1px solid "+S.amber+"44",borderRadius:7,padding:"12px 14px",marginBottom:14,fontSize:12,color:S.amber}}>No rounds yet. Tap "+ Add Round" above to start.</div>}

      {roundKeys.map(round=>(

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

            <div onClick={()=>{if(confirm("Remove Round "+round+"?"))removeRound(round);}}
              style={{background:S.red+"20",color:S.red,padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11}}>remove</div>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,background:S.green+"14",border:"1px solid "+S.green+"44",borderRadius:6,padding:"8px 10px"}}>
            <span style={{flex:1,fontSize:13,fontWeight:700,color:S.green}}>⚡ Standard Parcel</span>
            <input key={round+"_std"} type="number" step="0.01" inputMode="decimal" defaultValue={rounds[round]["Standard"]??0}
              onChange={e=>setStandard(round,e.target.value)} placeholder="1.00" style={inp} />
          </div>
          <div style={{fontSize:10,color:S.muted,marginBottom:12}}>Type this first — the rest fill in automatically ↓</div>

          {OTHER_TYPES.map(type=>(
            <div key={type} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{flex:1,fontSize:13,color:S.text}}>{type}</span>
              <input key={round+"_"+type+"_"+otherKey} type="number" step="0.01" inputMode="decimal" defaultValue={rounds[round][type]??0}
                onChange={e=>updateRate(round,type,e.target.value)} style={inp} />
            </div>
          ))}

          <div style={{borderTop:"1px solid "+S.border,margin:"12px 0"}}></div>
          <div onClick={()=>setSundayOpen(o=>({...o,[round]:!o[round]}))} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}}>
            <span style={{fontWeight:700,color:S.amber,fontSize:13}}>☀ Sunday rates <span style={{color:S.muted,fontWeight:400,fontSize:11}}>(optional)</span></span>
            <span style={{color:S.muted}}>{sundayOpen[round]?"▾":"▸"}</span>

            <div style={{marginTop:10}}>
              <div style={{fontSize:10.5,color:S.muted,marginBottom:10,lineHeight:1.5}}>Defaults to £1.00 each. Tick "Sunday" on a day to use these instead.</div>
              <div onClick={()=>setSundayFlat(f=>({...f,[round]:!f[round]}))} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:12}}>
                <span style={{width:20,height:20,borderRadius:4,border:"2px solid "+S.amber,background:sundayFlat[round]?S.amber:"transparent",color:"#0C2C47",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700}}>{sundayFlat[round]?"✓":""}</span>
                <span style={{fontSize:12.5,color:S.text}}>Flat rate <span style={{color:S.muted}}>— same £ for every type</span></span>
              </div>
              {sundayFlat[round] ? (
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,background:S.amber+"18",border:"1px solid "+S.amber+"55",borderRadius:6,padding:"8px 10px"}}>
                  <span style={{flex:1,fontSize:13,fontWeight:700,color:S.amber}}>☀ Every parcel</span>
                  <input type="number" step="0.01" inputMode="decimal" defaultValue={sundayRateFor(round,"Standard")}
                    onChange={e=>setAllSunday(round,e.target.value)} placeholder="1.20" style={inp} />
                </div>
              ) : (
                <>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,background:S.amber+"18",border:"1px solid "+S.amber+"55",borderRadius:6,padding:"8px 10px"}}>
                    <span style={{flex:1,fontSize:13,fontWeight:700,color:S.amber}}>☀ Standard Parcel</span>
                    <input key={"sunstd_"+round+"_"+sundayKey} type="number" step="0.01" inputMode="decimal" defaultValue={sundayRateFor(round,"Standard")}
                      onChange={e=>setStandardSunday(round,e.target.value)} placeholder="1.00" style={inp} />
                  </div>
                  <div style={{fontSize:10,color:S.muted,marginBottom:12}}>Type this first — the rest fill in automatically ↓</div>
                  {OTHER_TYPES.map(type=>(
                    <div key={"sun_"+type} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                      <span style={{flex:1,fontSize:13,color:S.text}}>{type}</span>
                      <input key={"sun_"+round+"_"+type+"_"+sundayKey} type="number" step="0.01" inputMode="decimal" defaultValue={sundayRateFor(round,type)}
                        onChange={e=>updateSundayRate(round,type,e.target.value)} style={inp} />
                    </div>
                  ))}
                </>
              )}
            </div>
          )}
        </div>
      ))}

      <div style={{fontSize:11,color:S.muted,textAlign:"center"}}>Changes save instantly and apply to every saved day</div>
    </>);
  }

  // HOME

      </div>
      {showTopUp && (
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,background:S.bg,border:"1px solid "+S.border,borderRadius:7,padding:"10px"}}>
          <span style={{color:S.muted,whiteSpace:"nowrap",fontSize:13}}>Top up £</span>
          <input type="number" step="0.01" inputMode="decimal" value={dayTopUp} onChange={e=>setDayTopUp(e.target.value)} placeholder="0.00"
            style={{width:80,background:S.card,border:"1px solid "+S.border,color:S.text,borderRadius:6,padding:"8px 10px",fontSize:14,textAlign:"right",fontFamily:"inherit",outline:"none"}} />
          <input type="text" value={dayTopUpLabel} onChange={e=>setDayTopUpLabel(e.target.value)} placeholder="reason (e.g. RTD bonus)"
            style={{flex:1,minWidth:0,background:S.card,border:"1px solid "+S.border,color:S.text,borderRadius:6,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}} />
        </div>
      )}

      <Btn color="green" onClick={saveManual}>✓ SAVE</Btn>
    </>);
  }

  // CLAIM CHECKER VIEW
  if (view==="claim") {
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const inp = {width:110,background:S.bg,border:"1px solid "+S.border,color:S.text,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none",textAlign:"right"};
    const addClaimRound = () => {
      const blank = {}; PARCEL_TYPE_LIST.forEach(t=>blank[t]="");
      setClaimRounds(L=>[...L,{round:"",period:"",counts:{...blank},paidAmount:""}]);
    };
    const removeClaimRound = (i) => setClaimRounds(L=>L.filter((_,idx)=>idx!==i));
    const updateClaim = (i,field,val) => setClaimRounds(L=>L.map((r,idx)=>idx===i?{...r,[field]:val}:r));
    const updateClaimCount = (i,type,val) => setClaimRounds(L=>L.map((r,idx)=>idx===i?{...r,counts:{...r.counts,[type]:val}}:r));
    const saveEnquiry = (cr,result) => {
      const counts = {};
      PARCEL_TYPE_LIST.forEach(t=>{ const v=parseInt(cr.counts[t])||0; if(v>0) counts[t]=v; });
      const e = { id:Date.now()+"_"+Math.random().toString(36).slice(2,6),
        round:(cr.round||"").trim(), period:(cr.period||"").trim(), invoiceNo:(cr.invoiceNo||"").trim(),
        shouldBe:result.calc, paid:result.paid, shortfall:result.shortfall,
        counts,
        date:new Date().toISOString().slice(0,10), ref:"",
        status:result.shortfall>0?"open":"correct" };
      saveEnquiries([e, ...enquiries]);
      setRefInput("");
      setRefPopup({id:e.id, hasClaim:result.shortfall>0});
    };
    const updateEnq = (id,field,val) => saveEnquiries(enquiries.map(e=>e.id===id?{...e,[field]:val}:e));
    const removeEnq = (id) => saveEnquiries(enquiries.filter(e=>e.id!==id));

    return wrap(<>
      {topBar("🧾 Invoice Checker", ()=>setView("home"))}

      <div style={{background:S.amber+"18",border:"1px solid "+S.amber+"55",borderRadius:8,padding:"12px 14px",marginBottom:14,fontSize:12,lineHeight:1.6}}>
        <b style={{color:S.amber}}>⚠ Check each round separately — do not combine rounds in one claim.</b>
        <div style={{color:S.muted,marginTop:4}}>Fill in one card per round. When a shortfall is found, copy the message and send it through the official channel.</div>
      </div>

      {/* REF SHEET (bottom sheet) */}
      {refPopup && (
        <div onClick={()=>{
            if(refInput.trim()) updateEnq(refPopup.id,"ref",refInput.trim());
            setRefPopup(null); setEnqOpen(true);
            setTimeout(()=>{ try{ document.querySelector('[data-enqtop]').scrollIntoView({behavior:"smooth"}); }catch{} },100);
          }}
          style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:999,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:S.card,borderTop:"1px solid "+S.border,borderTopLeftRadius:18,borderTopRightRadius:18,padding:"10px 20px calc(24px + env(safe-area-inset-bottom))",width:"100%",maxWidth:520,boxShadow:"0 -8px 30px rgba(0,0,0,0.3)",animation:"sheetUp 0.25s ease"}}>
            <div style={{width:38,height:4,borderRadius:2,background:S.border,margin:"0 auto 16px"}}></div>
            <div style={{fontWeight:700,fontSize:15,color:S.cyan,marginBottom:6}}>Saved ✓</div>
            {refPopup.hasClaim
              ? <div style={{fontSize:12.5,color:S.muted,marginBottom:14,lineHeight:1.5}}>If you've already sent the claim to Evri, enter the reference number they gave you — or leave blank and add it later.</div>
              : <div style={{fontSize:12.5,color:S.muted,marginBottom:14,lineHeight:1.5}}>Invoice saved to history.</div>
            }
            {refPopup.hasClaim && (
              <input type="text" value={refInput} onChange={e=>setRefInput(e.target.value)}
                placeholder="Evri enquiry reference (optional)"
                style={{width:"100%",background:S.bg,border:"1px solid "+S.border,color:S.text,fontFamily:"monospace",fontSize:14,borderRadius:8,padding:"11px 12px",outline:"none",marginBottom:14,boxSizing:"border-box"}} />
            )}
            <div onClick={()=>{
              if(refInput.trim()) updateEnq(refPopup.id,"ref",refInput.trim());
              setRefPopup(null);
              setEnqOpen(true);
              setTimeout(()=>{ try{ document.querySelector('[data-enqtop]').scrollIntoView({behavior:"smooth"}); }catch{} },100);
            }} style={{background:S.cyan,color:"#000",padding:"12px 0",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14,textAlign:"center"}}>
              Done — view record
            </div>
          </div>
        </div>
      )}

      {/* INVOICE HISTORY */}
      {enquiries.length>0 && (()=>{
        const hist = enquiries;
        const groups = {};
        hist.forEach(e=>{ const k=e.period||"—"; (groups[k]=groups[k]||[]).push(e); });
        const periodKeys = Object.keys(groups).sort((a,b)=>(parseInt(b)||0)-(parseInt(a)||0));
        return (
        <div style={{marginBottom:10}} data-enqtop>
          <div onClick={()=>setHistOpen(o=>!o)} style={{cursor:"pointer",background:S.panel,border:"1px solid "+S.border,borderRadius:8,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontWeight:700,fontSize:13,color:S.text}}>🗂 Invoice Data <span style={{color:S.muted,fontWeight:400,fontSize:11}}>({hist.length} saved)</span></span>
            <span style={{color:S.muted}}>{histOpen?"▾":"▸"}</span>
          </div>
          {histOpen && <div style={{marginTop:8}}>
            {periodKeys.map(pk=>{
              const list=groups[pk];
              const pOpen=histPeriodOpen[pk];
              return (<div key={pk} style={{marginBottom:6}}>
                <div onClick={()=>setHistPeriodOpen(o=>({...o,[pk]:!o[pk]}))} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"9px 14px"}}>
                  <span style={{fontWeight:700,fontSize:13,color:S.cyan}}>P{pk} <span style={{color:S.muted,fontWeight:400,fontSize:11}}>({list.length} {list.length>1?"rounds":"round"})</span></span>
                  <span style={{color:S.muted}}>{pOpen?"▾":"▸"}</span>
                </div>
                {pOpen && <div style={{marginTop:6,paddingLeft:8}}>
                  {list.map(e=>{
                    const counts = e.counts||{};
                    const hasBreakdown = Object.values(counts).some(v=>v>0);
                    return (
                    <div key={e.id} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <span style={{fontWeight:700,fontSize:13,color:S.cyan}}>Round {e.round||"—"}</span>
                        <div onClick={()=>removeEnq(e.id)} style={{background:S.red+"20",color:S.red,padding:"3px 9px",borderRadius:4,cursor:"pointer",fontSize:11}}>×</div>
                      </div>
                      {e.invoiceNo && <div style={{fontSize:11,color:S.muted,marginBottom:6,fontFamily:"monospace"}}>Invoice {e.invoiceNo}</div>}
                      {hasBreakdown && (
                        <div style={{marginBottom:8}}>
                          {PARCEL_TYPE_LIST.filter(t=>(counts[t]||0)>0).map(t=>(
                            <span key={t} style={{display:"inline-block",fontSize:11,color:S.muted,marginRight:10,marginBottom:2}}>
                              {t} <b style={{color:S.text}}>{counts[t]}</b>
                            </span>
                          ))}
                        </div>
                      )}
                      <div style={{display:"flex",gap:8,fontSize:12,flexWrap:"wrap",paddingTop:6,borderTop:"1px solid "+S.border}}>
                        <span style={{color:S.muted}}>Paid <b style={{color:S.text}}>{fmt(e.paid)}</b></span>
                        <span style={{color:S.muted}}>Should be <b style={{color:S.green}}>{fmt(e.shouldBe)}</b></span>
                        {e.shortfall>0 && <span style={{color:S.muted}}>Shortfall <b style={{color:S.red}}>{fmt(e.shortfall)}</b></span>}
                        {e.shortfall<=0 && <span style={{color:S.green,fontWeight:700}}>✓ correct</span>}
                      </div>
                    </div>
                    );
                  })}
                </div>}
              </div>);
            })}
          </div>}
        </div>
        );
      })()}

      {/* CLAIMS RECORD */}
      {enquiries.filter(e=>e.status!=="correct").length>0 && (()=>{
        const claims = enquiries.filter(e=>e.status!=="correct");
        const openList = claims.filter(e=>e.status==="open");
        const resolvedList = claims.filter(e=>e.status==="resolved");
        const owed = Math.round(openList.reduce((a,e)=>a+(e.shortfall||0),0)*100)/100;
        const recovered = Math.round(resolvedList.reduce((a,e)=>a+(e.shortfall||0),0)*100)/100;
        const groups = {};
        claims.forEach(e=>{ const k=e.period||"—"; (groups[k]=groups[k]||[]).push(e); });
        const periodKeys = Object.keys(groups).sort((a,b)=>(parseInt(b)||0)-(parseInt(a)||0));
        return (
        <div style={{marginBottom:10}}>
          <div onClick={()=>setEnqOpen(o=>!o)} style={{cursor:"pointer",background:S.panel,border:"1px solid "+S.border,borderRadius:8,padding:"11px 14px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:13,color:S.text}}>📂 Claims Record <span style={{color:S.muted,fontWeight:400,fontSize:11}}>({claims.length} total)</span></span>
              <span style={{color:S.muted}}>{enqOpen?"▾":"▸"}</span>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",fontSize:11}}>
              {openList.length>0 && <span style={{background:S.amber+"22",color:S.amber,borderRadius:5,padding:"3px 9px",fontWeight:700}}>● {openList.length} pending · owed {fmt(owed)}</span>}
              {resolvedList.length>0 && <span style={{background:S.green+"22",color:S.green,borderRadius:5,padding:"3px 9px",fontWeight:700}}>✓ {resolvedList.length} resolved · recovered {fmt(recovered)}</span>}
            </div>
          </div>
          {enqOpen && <div style={{marginTop:10}}>
            {periodKeys.map(pk=>{
              const list=groups[pk];
              const pOpen=enqPeriodOpen[pk];
              const pOwed=Math.round(list.filter(e=>e.status==="open").reduce((a,e)=>a+(e.shortfall||0),0)*100)/100;
              return (
              <div key={pk} style={{marginBottom:8}}>
                <div onClick={()=>setEnqPeriodOpen(o=>({...o,[pk]:!o[pk]}))} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"10px 14px"}}>
                  <span style={{fontWeight:700,fontSize:13,color:S.cyan}}>P{pk} <span style={{color:S.muted,fontWeight:400,fontSize:11}}>({list.length} {list.length>1?"rounds":"round"} · {fmt(pOwed)} short)</span></span>
                  <span style={{color:S.muted}}>{pOpen?"▾":"▸"}</span>
                </div>
                {pOpen && <div style={{marginTop:8,paddingLeft:8}}>
                  {list.map(e=>(
                    <div key={e.id} style={{background:S.card,border:"1px solid "+(e.status==="resolved"?S.green+"55":S.amber+"44"),borderRadius:8,padding:"12px 14px",marginBottom:8}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,color:S.muted,fontFamily:"monospace",marginBottom:4}}>
                            Ref <b style={{color:S.text}}>{e.ref||"—"}</b> · Invoice <b style={{color:S.text}}>{e.invoiceNo||"—"}</b>
                          </div>
                          <div style={{fontSize:12,color:S.muted,marginBottom:4}}>
                            Paid <b style={{color:S.text}}>{fmt(e.paid)}</b> · Should be <b style={{color:S.green}}>{fmt(e.shouldBe)}</b>
                          </div>
                          <div style={{fontSize:12,color:S.muted}}>
                            Shortfall <b style={{color:S.red}}>{fmt(e.shortfall)}</b>
                          </div>
                        </div>
                        <div onClick={()=>removeEnq(e.id)} style={{background:S.red+"20",color:S.red,padding:"3px 9px",borderRadius:4,cursor:"pointer",fontSize:11,flexShrink:0,marginLeft:8}}>×</div>
                      </div>
                      {!e.ref && (
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <span style={{fontSize:11,color:S.muted,whiteSpace:"nowrap"}}>Ref</span>
                          <input type="text" value={e.ref} onChange={ev=>updateEnq(e.id,"ref",ev.target.value)} placeholder="Evri enquiry reference"
                            style={{flex:1,minWidth:0,background:S.bg,border:"1px solid "+S.border,color:S.text,fontFamily:"monospace",fontSize:12,borderRadius:5,padding:"6px 8px",outline:"none"}} />
                        </div>
                      )}
                      <div onClick={()=>updateEnq(e.id,"status",e.status==="open"?"resolved":"open")}
                        style={{textAlign:"center",padding:"7px 0",borderRadius:5,cursor:"pointer",fontSize:12,fontWeight:700,
                          background:e.status==="resolved"?S.green+"22":S.amber+"22",color:e.status==="resolved"?S.green:S.amber,border:"1px solid "+(e.status==="resolved"?S.green+"44":S.amber+"44")}}>
                        {e.status==="resolved"?"✓ Resolved — tap to reopen":"● Pending — tap when resolved"}
                      </div>
                    </div>
                  ))}
                </div>}
              </div>
              );
            })}
          </div>}
        </div>
        );
      })()}

      {claimRounds.map((cr,i)=>{
        const rn = (cr.round||"").trim();
        const hasRoundRate = knownRounds.includes(rn);
        const canCalc = rn && hasRoundRate && (cr.period||"").trim() && (cr.invoiceNo||"").trim() && parseFloat(cr.paidAmount)>=0;
        let result = null;
        if (canCalc) result = buildClaimText(cr);
        const copied = claimCopied[i];

        return (
          <div key={i} style={{background:S.card,border:"1px solid "+(result&&result.shortfall>0?S.red+"88":S.border),borderRadius:8,padding:"14px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <b style={{color:S.cyan,fontSize:14}}>Round {rn||"—"}</b>
              {claimRounds.length>1 && <div onClick={()=>removeClaimRound(i)} style={{background:S.red+"20",color:S.red,padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11}}>remove</div>}
            </div>

            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:S.muted,marginBottom:4}}>Round number</div>
                <select value={rn} onChange={e=>updateClaim(i,"round",e.target.value)}
                  style={{width:"100%",background:S.bg,border:"1px solid "+(hasRoundRate||!rn?S.border:S.red),color:rn?S.text:S.muted,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none"}}>
                  <option value="">-- select --</option>
                  {knownRounds.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
                {rn && !hasRoundRate && <div style={{color:S.red,fontSize:10,marginTop:3}}>No rate set — add in Settings</div>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:S.muted,marginBottom:4}}>Period number *</div>
                <input type="text" inputMode="numeric" value={cr.period} onChange={e=>updateClaim(i,"period",e.target.value)} placeholder="e.g. 14"
                  style={{width:"100%",background:S.bg,border:"1px solid "+((cr.period||"").trim()?S.border:S.amber+"99"),color:S.text,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none"}} />
              </div>
            </div>

            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:S.muted,marginBottom:4}}>Invoice number *</div>
              <input type="text" inputMode="numeric" value={cr.invoiceNo||""} onChange={e=>updateClaim(i,"invoiceNo",e.target.value)} placeholder="e.g. 123456000010"
                style={{width:"100%",background:S.bg,border:"1px solid "+((cr.invoiceNo||"").trim()?S.border:S.amber+"99"),color:S.text,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none"}} />
            </div>

            <div style={{fontSize:11,color:S.muted,marginBottom:8,fontWeight:600}}>Parcel counts from invoice:</div>
            {PARCEL_TYPE_LIST.map(type=>(
              <div key={type} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                <span style={{flex:1,fontSize:13,color:S.text}}>{type}</span>
                <input type="number" min="0" value={cr.counts[type]??""} onChange={e=>updateClaimCount(i,type,e.target.value)} placeholder="0" style={inp} />
              </div>
            ))}

            <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,paddingTop:10,borderTop:"1px solid "+S.border}}>
              <span style={{flex:1,fontSize:13,color:S.text,fontWeight:700}}>Amount paid (£) *</span>
              <input type="number" min="0" step="0.01" value={cr.paidAmount} onChange={e=>updateClaim(i,"paidAmount",e.target.value)} placeholder="0.00" style={inp} />
            </div>

            {result && (
              <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid "+S.border}}>
                <div style={{display:"flex",gap:12,marginBottom:10,fontSize:13}}>
                  <div style={{flex:1,background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:S.muted,marginBottom:2}}>SHOULD BE</div>
                    <div style={{color:S.green,fontWeight:700}}>{fmt(result.calc)}</div>
                  </div>
                  <div style={{flex:1,background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:S.muted,marginBottom:2}}>PAID</div>
                    <div style={{color:S.text,fontWeight:700}}>{fmt(result.paid)}</div>
                  </div>
                  <div style={{flex:1,background:result.shortfall>0?S.red+"22":S.green+"22",border:"1px solid "+(result.shortfall>0?S.red+"66":S.green+"44"),borderRadius:6,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:10,color:S.muted,marginBottom:2}}>SHORTFALL</div>
                    <div style={{color:result.shortfall>0?S.red:S.green,fontWeight:700}}>{result.shortfall>0?fmt(result.shortfall):"None ✓"}</div>
                  </div>
                </div>
                {result.shortfall>0 && (
                  <>
                    <div style={{background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"10px",fontSize:11.5,color:S.muted,lineHeight:1.6,marginBottom:8,whiteSpace:"pre-wrap"}}>{result.text}</div>
                    <div onClick={()=>{navigator.clipboard.writeText(result.text).then(()=>{setClaimCopied(c=>({...c,[i]:true}));setTimeout(()=>setClaimCopied(c=>({...c,[i]:false})),2000);});}}
                      style={{background:copied?S.green:S.blue,color:copied?"#000":"#fff",padding:"10px 0",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"center"}}>
                      {copied?"✓ Copied!":"📋 Copy Claim Text"}
                    </div>
                  </>
                )}
                {result.shortfall<=0 && result.calc>0 && (
                  result.shortfall < -0.01 ? (
                    <div style={{background:S.amber+"18",border:"1px solid "+S.amber+"55",borderRadius:6,padding:"10px",fontSize:12,color:S.amber,textAlign:"center",marginBottom:8}}>⚠ Paid is £{Math.abs(result.shortfall).toFixed(2)} higher than expected — double-check your numbers.</div>
                  ) : (
                    <div style={{background:S.green+"18",border:"1px solid "+S.green+"44",borderRadius:6,padding:"10px",fontSize:12,color:S.green,textAlign:"center",marginBottom:8}}>✓ Pay looks correct — no shortfall found.</div>
                  )
                )}
                <div onClick={()=>saveEnquiry(cr,result)}
                  style={{background:S.panel,border:"1px solid "+S.cyan+"66",color:S.cyan,padding:"9px 0",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12.5,textAlign:"center"}}>
                  {result.shortfall>0?"+ Save as enquiry to track":"+ Save to history"}
                </div>
              </div>
            )}
            {!(cr.period||"").trim() && <div style={{marginTop:8,fontSize:10.5,color:S.amber}}>* Enter period number to generate claim text.</div>}
          </div>
        );
      })}

      <div onClick={addClaimRound} style={{background:S.panel,border:"1px dashed "+S.cyan+"66",color:S.cyan,padding:"12px 0",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:13,textAlign:"center",marginBottom:14}}>+ Add Another Round</div>
    </>);
  }

  // PASTE VIEW
  if (view==="paste") return wrap(<>
    {topBar("ADD DAY", ()=>setView("period"))}

    <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"14px"}}>
      <div style={{fontWeight:700,marginBottom:6,color:S.cyan}}>📋 Paste Manifest Text</div>
      <div style={{fontSize:11,color:S.muted,marginBottom:10,lineHeight:1.5}}>Open your Manifest Summary in the courier app, select &amp; copy all the text (including the Day Summary), then paste it here.</div>
      <textarea rows={12} value={pasteText} onChange={e=>setPasteText(e.target.value)}
        placeholder={"Round Number: 123456\nManifest Date: 01/01/2026\nSmall Packet: 30\nPacket: 10\n...\nSuccessful deliveries: 150\nCarry forward: 5\nCannot deliver: 0"} />
      {parseError && <div style={{color:S.red,fontSize:11,marginTop:8}}>{parseError}</div>}
      <Btn color="cyan" onClick={doParse} style={{marginTop:10}}>PARSE →</Btn>
    </div>
  </>);

  // CONFIRM VIEW
  if (view==="confirm" && parsed) {
    let totalAmount=0;
    (parsed.manifests||[]).forEach(m=>{totalAmount+=calcRound(m.round_number,m.parcels,rateConfig,dayIsSunday).total;});
    totalAmount += Number(dayTopUp)||0;
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const hasRate = rn => knownRounds.includes(String(rn));
    const unknownRounds = (parsed.manifests||[]).map(m=>m.round_number).filter(rn=>!hasRate(rn));
    const blockSave = unknownRounds.length>0;
    return wrap(<>
      {topBar("CONFIRM DATA", ()=>setView("paste"))}
      {blockSave && (
        <div style={{background:S.red+"18",border:"1px solid "+S.red+"66",borderRadius:8,padding:"12px 14px",marginBottom:12,fontSize:12.5,lineHeight:1.6}}>
          <div style={{color:S.red,fontWeight:700,marginBottom:4}}>⚠ Round not set up: {unknownRounds.join(", ")}</div>
          <div style={{color:S.text}}>This round has no rate, so pay shows £0.00. Check the number is correct, or add it in Settings first.</div>
          {knownRounds.length>0 && <div style={{color:S.muted,marginTop:6}}>Your rounds in Settings: {knownRounds.join(", ")}</div>}
        </div>
      )}
      <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:13}}>
          <span>📅 <b>{parsed.date}</b></span>
          {parsed.distance_miles && <span style={{color:S.cyan}}>🚐 {parsed.distance_miles}mi</span>}
          {parsed.duration_hours!=null && <span style={{color:S.cyan}}>⏱ {parsed.duration_hours}h {parsed.duration_minutes}m</span>}
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}}>
        <div onClick={()=>setDayIsSunday(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
          <span style={{width:22,height:22,borderRadius:5,border:"2px solid "+S.cyan,background:dayIsSunday?S.cyan:"transparent",color:"#0C2C47",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700}}>{dayIsSunday?"✓":""}</span>
          <span style={{fontSize:13}}>This is a <b style={{color:S.amber}}>Sunday</b></span>
        </div>
        <div onClick={()=>setShowTopUp(v=>!v)} style={{background:S.card,border:"1px solid "+S.border,borderRadius:6,padding:"6px 12px",fontSize:11.5,cursor:"pointer",whiteSpace:"nowrap"}}>+ Top up</div>
      </div>
      {showTopUp && (
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,background:S.bg,border:"1px solid "+S.border,borderRadius:7,padding:"10px"}}>
          <span style={{color:S.muted,whiteSpace:"nowrap",fontSize:13}}>Top up £</span>
          <input type="number" step="0.01" inputMode="decimal" value={dayTopUp} onChange={e=>setDayTopUp(e.target.value)} placeholder="0.00"
            style={{width:80,background:S.card,border:"1px solid "+S.border,color:S.text,borderRadius:6,padding:"8px 10px",fontSize:14,textAlign:"right",fontFamily:"inherit",outline:"none"}} />
          <input type="text" value={dayTopUpLabel} onChange={e=>setDayTopUpLabel(e.target.value)} placeholder="reason (e.g. RTD bonus)"
            style={{flex:1,minWidth:0,background:S.card,border:"1px solid "+S.border,color:S.text,borderRadius:6,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}} />
        </div>
      )}
      {(parsed.manifests||[]).map((m,i)=>{
        const {total,lines}=calcRound(m.round_number,m.parcels,rateConfig,dayIsSunday);
        return (
          <div key={i} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <b style={{fontSize:14}}>Round {m.round_number}</b>
              <span style={{color:S.amber,fontWeight:700}}>{fmt(total)}</span>
            </div>
            {!hasRate(m.round_number) && <div style={{color:S.red,fontSize:11,marginBottom:8}}>⚠ No rate set for this round</div>}
            {lines.filter(l=>l.count>0).map((l,j)=>(
              <div key={j} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:12,marginBottom:4}}>
                <span style={{color:S.text,flexShrink:0}}>{l.type} <span style={{color:S.cyan}}>×{l.count}</span></span>
                <span style={{color:S.muted,textAlign:"right"}}>£{l.rate.toFixed(2)} = <b style={{color:S.amber}}>£{l.sub.toFixed(2)}</b></span>
              </div>
            ))}
            {lines.filter(l=>l.count>0).length===0 && <div style={{color:S.red,fontSize:11}}>⚠ No parcel counts found</div>}
          </div>
        );
      })}
      {(() => {
        const combined={};let grandCount=0;
        (parsed.manifests||[]).forEach(m=>Object.entries(m.parcels).forEach(([type,count])=>{if(count>0){combined[type]=(combined[type]||0)+count;grandCount+=count;}}));
        if(Object.keys(combined).length===0) return null;
        return (
          <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontWeight:700,marginBottom:8,display:"flex",justifyContent:"space-between"}}>
              <span>All Rounds Combined</span>
              <span style={{color:S.muted,fontSize:12}}>total {grandCount}</span>
            </div>
            {Object.entries(combined).map(([type,count],j)=>(
              <div key={j} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:12,marginBottom:3}}>
                <span style={{color:S.text,flexShrink:0}}>{type}</span><span style={{color:S.cyan}}>×{count}</span>
              </div>
            ))}
          </div>
        );
      })()}
      {parsed.day_summary && (
        <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:12,fontSize:12}}>
          <div style={{fontWeight:700,marginBottom:6}}>Day Summary</div>
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <span style={{color:S.green}}>✓ {parsed.day_summary.successful}</span>
            <span style={{color:S.amber}}>CF {parsed.day_summary.carry_forward}</span>
            <span style={{color:S.red}}>✗ {parsed.day_summary.cannot_deliver}</span>
            {parsed.day_summary.successful_collections>0 && (
              <span style={{color:S.cyan}}>📦 Collections {parsed.day_summary.successful_collections}</span>
            )}
          </div>
        </div>
      )}
      <div style={{background:S.panel,borderRadius:8,padding:"12px 14px",marginBottom:14}}>
        {dayIsSunday && <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:S.muted,marginBottom:6}}><span>☀ Sunday rates applied</span></div>}
        {(Number(dayTopUp)||0)>0 && <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:S.muted,marginBottom:6}}><span>+ Top up{dayTopUpLabel.trim()?" ("+dayTopUpLabel.trim()+")":""}</span><span style={{color:S.amber}}>{fmt(Number(dayTopUp))}</span></div>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:S.muted}}>Total Earnings</span>
          <span style={{color:S.amber,fontWeight:700,fontSize:20}}>{fmt(totalAmount)}</span>
        </div>
      </div>
      {blockSave
        ? <>
            <div style={{background:S.panel,border:"1px solid "+S.border,opacity:0.5,color:S.muted,padding:"13px 0",borderRadius:7,textAlign:"center",fontWeight:700,fontSize:14,marginBottom:10}}>✓ SAVE (fix round first)</div>
            <div onClick={()=>setView("settings")} style={{background:S.cyan,color:"#000",padding:"12px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"center"}}>⚙ Go to Settings to add the round</div>
          </>
        : <Btn color="green" onClick={saveDay}>✓ SAVE</Btn>}
    </>);
  }

  // DAY DETAIL
  if (view.startsWith("day_") && activePeriod) {
    const di=parseInt(view.split("_")[1]);
    const d=activePeriod.days[di];
    if(!d){setView("period");return null;}
    return wrap(<>
      {topBar("📅 "+d.date, ()=>setView("period"))}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <Stat label="Manifest" value={d.manifested} />
        <Stat label="Delivered" value={d.successful} color={S.green} />
        <Stat label="CF" value={d.carry_forward} color={S.amber} />
        <Stat label="Collection" value={d.successful_collections||0} color={S.cyan} />
        <Stat label="Earned" value={fmt(dayAmount(d,rateConfig))} color={S.amber} />
        {d.distance_miles>0 && <Stat label="Miles" value={d.distance_miles+"mi"} color={S.cyan} />}
        {d.duration_hours>0 && <Stat label="Drive" value={d.duration_hours+"h"+d.duration_minutes+"m"} color={S.cyan} />}
      </div>
      {(d.rounds||[]).map((r,i)=>{
        const live=calcRound(r.round,r.parcels,rateConfig);
        return (
        <div key={i} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <b>Round {r.round}</b><span style={{color:S.amber}}>{fmt(live.total)}</span>
          </div>
          {live.lines.map((l,j)=>(
            <div key={j} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:12,color:S.muted,marginBottom:3}}>
              <span style={{flexShrink:0}}>{l.type}</span>
              <span style={{textAlign:"right"}}>{l.count} × £{l.rate.toFixed(2)} = <b style={{color:S.text}}>£{l.sub.toFixed(2)}</b></span>
            </div>
          ))}
        </div>
      );})}
    </>);
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
