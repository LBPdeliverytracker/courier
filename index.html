function loadRates() {
  try {
    const r = localStorage.getItem("delivery_rates");
    if (r) {
      const parsed = JSON.parse(r);
      // migrate old format {default, special} -> {rounds}
      if (parsed.rounds) return parsed;
      const rounds = {...(parsed.special||{})};
      return { rounds };
    }
  } catch {}
  return { rounds: {} };
}
function saveRates(r) {
  try { localStorage.setItem("delivery_rates", JSON.stringify(r)); } catch {}
}

function calcRound(roundNum, parcels, rateConfig) {
  const rates = (rateConfig?.rounds?.[roundNum]) || {};
  let total = 0;
  const lines = [];
  for (const [type, count] of Object.entries(parcels)) {
    if (!count) continue;
    const rate = rates[type] ?? 0;
    const sub = Math.round(count * rate * 100) / 100;
    lines.push({ type, count, rate, sub });
    total += sub;
  }
  return { total: Math.round(total * 100) / 100, lines };
}

function loadData() {
  try { const r = localStorage.getItem("delivery_tracker"); return r ? JSON.parse(r) : { periods: [] }; }
  catch { return { periods: [] }; }
}
function saveData(d) {
  try { localStorage.setItem("delivery_tracker", JSON.stringify(d)); } catch {}
}

function parseText(rawText) {
  // Normalise common copy/OCR glitches: lone letter O used as zero (e.g. "Cannot deliver: O")
  const text = rawText
    .replace(/:\s*O\b/g, ": 0")
    .replace(/\u00A0/g, " ");
  const PARCEL_TYPES = ["Small Packet","Heavy/Large","Hanging Garment","Standard","Postable","Packet","Heavy","Collection"];
  const result = { date:null, distance_miles:null, duration_hours:null, duration_minutes:null, manifests:[], day_summary:null };
  const dateM = text.match(/Manifest Date\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);
  if (dateM) result.date = dateM[1];
  const distM = text.match(/estimated distance of ([\d.]+)\s*mile/i);
  if (distM) result.distance_miles = parseFloat(distM[1]);
  const durM = text.match(/(\d+)\s*hour\(s\)\s*(\d+)\s*minute/i);
  if (durM) { result.duration_hours = parseInt(durM[1]); result.duration_minutes = parseInt(durM[2]); }
  // Round number may be "Round Number: 123", "RoundNumber:123", "Round 123", etc.
  const roundRe = /Round\s*(?:Number)?\s*:?\s*(\d{3,})/ig;
  // Split into blocks at each round marker so parcels stay with their round
  const markers = [];
  let mm;
  while ((mm = roundRe.exec(text)) !== null) {
    markers.push({ idx: mm.index, end: roundRe.lastIndex, round: parseInt(mm[1]) });
  }
  // Helper: count parcel types within a segment using a "consume" approach —
  // match longest type names first and blank them out so e.g. "Packet" can't
  // re-match the tail of "Small Packet", and "Heavy" can't match "Heavy/Large".
  const TYPE_ORDER = ["Small Packet","Heavy/Large","Hanging Garment","Postable","Standard","Collection","Packet","Heavy"];
  if (markers.length > 0) {
    markers.forEach((mk, i) => {
      const segStart = mk.end;
      const segEnd = (i+1 < markers.length) ? markers[i+1].idx : text.length;
      let seg = text.slice(segStart, segEnd);
      const cut = seg.search(/estimated distance|Successful deliveries|Service Offers|Postcode/i);
      if (cut !== -1) seg = seg.slice(0, cut);
      const parcels = {};
      PARCEL_TYPES.forEach(t => parcels[t] = 0);
      let work = seg;
      TYPE_ORDER.forEach(type => {
        const esc = type.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(esc + "\\s*:?\\s*(\\d+)", "i");
        const m = work.match(re);
        if (m) {
          parcels[type] = parseInt(m[1]);
          work = work.slice(0, m.index) + " ".repeat(m[0].length) + work.slice(m.index + m[0].length);
        }
      });
      result.manifests.push({ round_number: mk.round, parcels });
    });
  }
  const succM = text.match(/Successful deliveries\s*:?\s*(\d+)/i);
  const cfM = text.match(/Carry forward\s*:?\s*(\d+)/i);
  const failM = text.match(/Cannot deliver\s*:?\s*(\d+)/i);
  const succColM = text.match(/Successful collections?\s*:?\s*(\d+)/i);
  if (succM || cfM || failM) {
    result.day_summary = {
      successful: succM ? parseInt(succM[1]) : 0,
      carry_forward: cfM ? parseInt(cfM[1]) : 0,
      cannot_deliver: failM ? parseInt(failM[1]) : 0,
      successful_collections: succColM ? parseInt(succColM[1]) : 0,
    };
  }
  if (result.manifests.length === 0) throw new Error("No Round Numbers found.");
  return result;
}

const fmt = v => "£" + Number(v||0).toFixed(2);
const pct = (a,b) => b > 0 ? ((a/b)*100).toFixed(1)+"%" : "—";
const dateKey = (s) => { const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? parseInt(m[3])*10000+parseInt(m[2])*100+parseInt(m[1]) : 0; };
// Live recompute a day's total from stored parcels + current rates
function dayAmount(d, rateConfig) {
  let t = 0;
  (d.rounds||[]).forEach(r => { t += calcRound(r.round, r.parcels, rateConfig).total; });
  return Math.round(t*100)/100;
}

function PeriodNameEditor({ name, onSave }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(name);
  if (!editing) return (
    <div style={{ display:"flex", alignItems:"center", gap:8, flex:1 }}>
      <span style={{ fontWeight:700, fontSize:16 }}>{name}</span>
      <div onClick={() => { setVal(name); setEditing(true); }}
        style={{ background:S.card, border:"1px solid "+S.border, color:S.muted, padding:"3px 10px", borderRadius:4, cursor:"pointer", fontSize:11 }}>✏ edit</div>
    </div>
  );
  return (
    <div style={{ display:"flex", gap:6, flex:1 }}>
      <input type="text" value={val} onChange={e => setVal(e.target.value)}
        style={{ flex:1, background:S.card, border:"1px solid "+S.blue, color:S.text, fontFamily:"monospace", fontSize:13, borderRadius:5, padding:"5px 10px", outline:"none" }}
        onKeyDown={e => { if(e.key==="Enter"&&val.trim()){onSave(val.trim());setEditing(false);} if(e.key==="Escape")setEditing(false); }}
        autoFocus />
      <div onClick={() => { if(val.trim()){onSave(val.trim());setEditing(false);} }}
        style={{ background:S.green, color:"#000", padding:"5px 12px", borderRadius:4, cursor:"pointer", fontSize:12, fontWeight:700 }}>✓</div>
      <div onClick={() => setEditing(false)}
        style={{ background:S.card, color:S.muted, padding:"5px 10px", borderRadius:4, cursor:"pointer", fontSize:12 }}>✕</div>
    </div>
  );
}

  const [expandedDay, setExpandedDay] = useState(null);
  const [claimRounds, setClaimRounds] = useState([]);
  const [claimCopied, setClaimCopied] = useState({});

  function initClaim() {
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const blank = {};
    PARCEL_TYPE_LIST.forEach(t => blank[t] = "");
    setClaimRounds([{
      round: knownRounds.length===1 ? knownRounds[0] : "",
      period: "",
      counts: {...blank},
      paidAmount: "",
    }]);
    setClaimCopied({});
  }

  function buildClaimText(cr) {
    const rn = (cr.round||"").trim();
    const pn = (cr.period||"").trim();
    const parcels = {};
    PARCEL_TYPE_LIST.forEach(t => { parcels[t] = parseInt(cr.counts[t])||0; });
    const { total: calc, lines } = calcRound(parseInt(rn)||rn, parcels, rateConfig);
    const parts = [];
    PARCEL_TYPE_LIST.forEach(t => {
      const c = parseInt(cr.counts[t])||0;
      if (!c) return;
      parts.push(t + " \u00d7" + c);
    });
    const paid = Math.round((parseFloat(cr.paidAmount)||0)*100)/100;
    const shortfall = Math.round((calc - paid)*100)/100;
    const parcelStr = parts.join(", ");
    const text = "Hi, I've checked round " + rn + " on period " + pn + ". Based on the parcels delivered \u2014 " + parcelStr + " \u2014 at the published rates, the total should be \u00a3" + calc.toFixed(2) + ". However, the amount paid was \u00a3" + paid.toFixed(2) + ", a shortfall of \u00a3" + shortfall.toFixed(2) + ". Could you please review and correct this payment? Thank you.";
    return { text, calc, paid, shortfall };
  }

  // keep palette + body bg in sync with theme
  applyTheme(light);
  useEffect(() => {
    try { localStorage.setItem("dt_light", light?"1":"0"); } catch {}
    document.body.style.background = S.bg;
    document.body.style.color = S.text;
  }, [light]);
  useEffect(() => { try { localStorage.setItem("dt_font", String(fontScale)); } catch {} }, [fontScale]);

  const showToast = (msg, ok=true) => { setToast({msg,ok}); setTimeout(()=>setToast(null),2500); };

  const persist = useCallback(nd => {
    saveData(nd);
    setData(nd);
  }, []);

  function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="delivery-backup.json"; a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if(!imported.periods) throw new Error();
        persist(imported);
        showToast("Imported "+imported.periods.length+" periods");
      } catch { showToast("Invalid file", false); }
    };
    reader.readAsText(file);
  }

  const activePeriod = data.periods[activePi];

  function pStats(p) {
    let total=0,success=0,failed=0,cf=0,amount=0,miles=0,mins=0,collections=0;
    const types={};
    (p.days||[]).forEach(d => {
      total+=d.manifested||0; success+=d.successful||0; failed+=d.cannot_deliver||0;
      cf+=d.carry_forward||0; amount+=dayAmount(d,rateConfig); miles+=d.distance_miles||0;
      mins+=(d.duration_hours||0)*60+(d.duration_minutes||0);
      collections+=d.successful_collections||0;
      (d.rounds||[]).forEach(r => {
        Object.entries(r.parcels||{}).forEach(([t,c]) => { if(c>0) types[t]=(types[t]||0)+c; });
      });
    });
    return {total,success,failed,cf,amount,miles:Math.round(miles*10)/10,mins,types,collections};
  }

  function doParse() {
    if(!pasteText.trim()) return;
    setParseError(null); setParsed(null);
    try { const r=parseText(pasteText); setParsed(r); setView("confirm"); }
    catch(e) { setParseError("Parse failed: "+e.message); }
  }

  function saveDay() {
    if(!parsed?.date){showToast("No date found",false);return;}
    let manifested=0, amount=0;
    const rounds=[];
    (parsed.manifests||[]).forEach(m => {
      const {total,lines}=calcRound(m.round_number,m.parcels,rateConfig);
      const cnt=Object.values(m.parcels).reduce((a,v)=>a+(v||0),0);
      manifested+=cnt; amount+=total;
      rounds.push({round:m.round_number,parcels:m.parcels,subtotal:total,lines});
    });
    const dayObj = {
      date:parsed.date, manifested,
      successful:parsed.day_summary?.successful||0,
      carry_forward:parsed.day_summary?.carry_forward||0,
      cannot_deliver:parsed.day_summary?.cannot_deliver||0,
      successful_collections:parsed.day_summary?.successful_collections||0,
      distance_miles:parsed.distance_miles||0,
      duration_hours:parsed.duration_hours||0,
      duration_minutes:parsed.duration_minutes||0,
      amount:Math.round(amount*100)/100, rounds, savedAt:Date.now(),
    };
    const periods = data.periods.map((p,pi) => {
      if(pi!==activePi) return p;
      const days=[...p.days.filter(d=>d.date!==dayObj.date),dayObj].sort((a,b)=>dateKey(a.date)-dateKey(b.date));
      return {...p,days};
    });
    persist({...data,periods});
    showToast("Saved!");
    setPasteText(""); setParsed(null);
    setView("period");
  }

  function avgMilesHours() {
    const p = data.periods[activePi];
    let miles=0, mins=0, n=0;
    (p?.days||[]).forEach(d => {
      if((d.distance_miles||0)>0){ miles+=d.distance_miles; mins+=(d.duration_hours||0)*60+(d.duration_minutes||0); n++; }
    });
    if(n===0) return null;
    return { miles: Math.round((miles/n)*100)/100, hours: Math.round((mins/n)/60*100)/100 };
  }

  function initManual() {
    const blank={}; PARCEL_TYPE_LIST.forEach(t=>blank[t]="");
    setManualDate("");
    setManualList([{round:"", counts:{...blank}}]);
    setManualDay({successful:"",carry_forward:"",cannot_deliver:""});
    setManualDist({miles:"",hours:""});
  }

  function saveManual() {
    // accept DDMM (digits only) or DD/MM
    let raw = manualDate.trim().replace(/\D/g,""); // strip non-digits -> e.g. 0506
    let dd, mm;
    if(raw.length===3){ dd=raw.slice(0,1); mm=raw.slice(1); }      // 506 -> 5/06
    else if(raw.length===4){ dd=raw.slice(0,2); mm=raw.slice(2); } // 0506 -> 05/06
    else { showToast("Enter date as DDMM, e.g. 0506", false); return; }
    const di=parseInt(dd), mi=parseInt(mm);
    if(di<1||di>31||mi<1||mi>12){ showToast("Invalid date", false); return; }
    const yr = new Date().getFullYear();
    const fullDate = String(di).padStart(2,"0")+"/"+String(mi).padStart(2,"0")+"/"+yr;

    const valid = manualList.filter(r=>/^\d+$/.test((r.round||"").trim()));
    if(valid.length===0){ showToast("Enter at least one Round number", false); return; }

    // block save if any round has no rate set in Settings
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const missing = valid.map(r=>r.round.trim()).filter(rn=>!knownRounds.includes(rn));
    if(missing.length>0){
      showToast("Round "+missing.join(", ")+" has no rate — add it in Settings first", false);
      return;
    }

    let manifested=0, amount=0;
    const rounds=[];
    valid.forEach(r => {
      const rn=parseInt(r.round.trim());
      const parcels={};
      PARCEL_TYPE_LIST.forEach(t => { parcels[t]=parseInt(r.counts[t])||0; });
      const {total,lines}=calcRound(rn,parcels,rateConfig);
      const cnt=Object.values(parcels).reduce((a,v)=>a+(v||0),0);
      manifested+=cnt; amount+=total;
      rounds.push({round:rn,parcels,subtotal:total,lines});
    });

    // miles/hours: use entered, else average, else 0
    const avg = avgMilesHours();
    const miles = manualDist.miles!=="" ? parseFloat(manualDist.miles) : (avg?avg.miles:0);
    const hoursDec = manualDist.hours!=="" ? parseFloat(manualDist.hours) : (avg?avg.hours:0);
    const dh = Math.floor(hoursDec);
    const dmins = Math.round((hoursDec-dh)*60);

    const dayObj = {
      date:fullDate, manifested,
      successful:parseInt(manualDay.successful)||0,
      carry_forward:parseInt(manualDay.carry_forward)||0,
      cannot_deliver:parseInt(manualDay.cannot_deliver)||0,
      distance_miles:Math.round((miles||0)*100)/100,
      duration_hours:dh||0, duration_minutes:dmins||0,
      amount:Math.round(amount*100)/100, rounds, savedAt:Date.now(),
    };
    const periods = data.periods.map((p,pi) => {
      if(pi!==activePi) return p;
      const days=[...p.days.filter(d=>d.date!==dayObj.date),dayObj].sort((a,b)=>dateKey(a.date)-dateKey(b.date));
      return {...p,days};
    });
    persist({...data,periods});
    showToast("Saved!");
    setView("period");
  }

  function deleteDay(di) {
    const periods=data.periods.map((p,pi)=>pi!==activePi?p:{...p,days:p.days.filter((_,i)=>i!==di)});
    persist({...data,periods}); showToast("Deleted");
  }

    persist({...data,periods:data.periods.filter((_,i)=>i!==activePi)});
    showToast("Deleted"); setView("home");
  }

        <div style={p}>The amounts shown in <Key>🧾 Invoice Checker</Key> are <Hi>guidelines only</Hi>. Your actual pay may differ because of factors outside this app's knowledge:</div>

        <div style={{...mut,marginBottom:10}}>• <b>Customer not available (CNA) deductions</b> — these may affect your totals depending on your agreement</div>
        <div style={p}>If you believe there is a genuine shortfall after accounting for the above, use the claim text generated by the app as a <Hi>starting point</Hi> and raise it through the <Hi>official disputes or pay query process</Hi>. This app is not affiliated with any courier company and cannot guarantee the accuracy of calculated figures.</div>

        <div style={h}>9 · Your privacy &amp; data</div>
        <div style={p}>Here's exactly what happens to your data — no vague claims:</div>
        <div style={{...mut,marginBottom:6}}>• <Hi>Your delivery data stays on your phone.</Hi> Everything you enter (rounds, rates, parcels, earnings) is saved in your browser's local storage on this device only. It is never sent to any server, and there is no account or login.</div>
        <div style={{...mut,marginBottom:6}}>• <Hi>Backups stay with you.</Hi> When you tap Backup, the file saves to your own phone. Nothing is uploaded.</div>
        <div style={{...mut,marginBottom:6}}>• <Hi>Analytics.</Hi> Like most free apps, this app uses Google Analytics to count anonymous usage (e.g. how many people open it). This does not include your delivery data, names, or any personal details.</div>

  // SETTINGS VIEW
  if (view==="settings") {
    const rounds = rateConfig.rounds || {};
    const r2 = v => Math.round(v*100)/100;
    // compute all 8 rates from a Standard base, per Evri bands + minimums
    const deriveFromStandard = (base) => ({
      "Small Packet":   Math.max(r2(base*0.69), 0.35),
      "Packet":         Math.max(r2(base*0.75), 0.40),
      "Standard":       r2(base),
      "Postable":       Math.max(r2(base*0.60), 0.30),
      "Heavy":          Math.max(r2(base), 1.00),
      "Heavy/Large":    Math.max(r2(base), 1.00),
      "Hanging Garment":r2(base),
      "Collection":     r2(base*0.80),
    });
    const updateRate = (round, type, val) => {
      const nc = {...rateConfig, rounds:{...rounds, [round]:{...(rounds[round]||{}), [type]: parseFloat(val)||0}}};
      setRateConfig(nc); saveRates(nc);
    };
    // typing the Standard rate auto-fills every other type (still editable after)
    const setStandard = (round, val) => {
      const base = parseFloat(val);
      if (!base || base<=0) { updateRate(round, "Standard", val); return; }
      const filled = deriveFromStandard(base);
      const nc = {...rateConfig, rounds:{...rounds, [round]:filled}};
      setRateConfig(nc); saveRates(nc); setFormKey(k=>k+1);
    };
    const addRound = () => {
      const rn = prompt("Enter your Round Number (e.g. 123456):");
      if (!rn || !/^\d+$/.test(rn.trim())) { if(rn) showToast("Numbers only", false); return; }
      const key = rn.trim();
      if (rounds[key]) { showToast("Round already exists", false); return; }
      const blank = {}; PARCEL_TYPE_LIST.forEach(t=>blank[t]=0);
      const nc = {...rateConfig, rounds:{...rounds, [key]:blank}};
      setRateConfig(nc); saveRates(nc); showToast("Added round "+key);
    };
    const removeRound = (round) => {
      const r = {...rounds}; delete r[round];
      const nc = {...rateConfig, rounds:r};
      setRateConfig(nc); saveRates(nc);
    };
    const roundKeys = Object.keys(rounds);
    const inp = {width:90,background:S.bg,border:"1px solid "+S.border,color:S.text,fontFamily:"monospace",fontSize:13,borderRadius:5,padding:"6px 8px",outline:"none",textAlign:"right"};
    const OTHER_TYPES = PARCEL_TYPE_LIST.filter(t=>t!=="Standard");
    return wrap(<>
      {topBar("⚙ Settings", ()=>setView("home"))}

      <div onClick={addRound} style={{background:S.cyan,color:"#000",padding:"13px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:14,textAlign:"center",marginBottom:14}}>+ Add Round</div>

      <div style={{fontSize:11,color:S.muted,marginBottom:14,lineHeight:1.5}}>Just type your <b style={{color:S.text}}>Standard Parcel rate</b> — every other type fills in automatically from Evri's pay bands. You can still edit any of them below.</div>

      {roundKeys.length===0 && <div style={{background:S.amber+"15",border:"1px solid "+S.amber+"44",borderRadius:7,padding:"12px 14px",marginBottom:14,fontSize:12,color:S.amber}}>No rounds yet. Tap "+ Add Round" above to start.</div>}

      {roundKeys.map(round=>(
        <div key={round} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"14px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontWeight:700,color:S.cyan,fontSize:15}}>Round {round}</span>
            <div onClick={()=>{if(confirm("Remove Round "+round+"?"))removeRound(round);}}
              style={{background:S.red+"20",color:S.red,padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11}}>remove</div>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,background:S.green+"14",border:"1px solid "+S.green+"44",borderRadius:6,padding:"8px 10px"}}>
            <span style={{flex:1,fontSize:13,fontWeight:700,color:S.green}}>⚡ Standard Parcel</span>
            <input key={round+"_std_"+formKey} type="number" step="0.01" inputMode="decimal" defaultValue={rounds[round]["Standard"]??0}
              onChange={e=>setStandard(round,e.target.value)} placeholder="1.00" style={inp} />
          </div>
          <div style={{fontSize:10,color:S.muted,marginBottom:12}}>Type this first — the rest fill in automatically ↓</div>

          {OTHER_TYPES.map(type=>(
            <div key={type} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{flex:1,fontSize:13,color:S.text}}>{type}</span>
              <input key={round+"_"+type+"_"+formKey} type="number" step="0.01" inputMode="decimal" defaultValue={rounds[round][type]??0}
                onChange={e=>updateRate(round,type,e.target.value)} style={inp} />
            </div>
          ))}
        </div>
      ))}

      <div style={{fontSize:11,color:S.muted,textAlign:"center"}}>Changes save instantly and apply to every saved day</div>
    </>);
  }

  // HOME

                    <div style={{fontSize:10,color:S.muted,marginBottom:2}}>SHORTFALL</div>
                    <div style={{color:result.shortfall>0?S.red:S.green,fontWeight:700}}>{result.shortfall>0?fmt(result.shortfall):"None ✓"}</div>
                  </div>
                </div>
                {result.shortfall>0 && (
                  <>
                    <div style={{background:S.bg,border:"1px solid "+S.border,borderRadius:6,padding:"10px",fontSize:11.5,color:S.muted,lineHeight:1.6,marginBottom:8,whiteSpace:"pre-wrap"}}>{result.text}</div>
                    <div onClick={()=>{navigator.clipboard.writeText(result.text).then(()=>{setClaimCopied(c=>({...c,[i]:true}));setTimeout(()=>setClaimCopied(c=>({...c,[i]:false})),2000);});}}
                      style={{background:copied?S.green:S.blue,color:copied?"#000":"#fff",padding:"10px 0",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"center"}}>
                      {copied?"✓ Copied!":"📋 Copy Claim Text"}
                    </div>
                  </>
                )}
                {result.shortfall<=0 && result.calc>0 && (
                  <div style={{background:S.green+"18",border:"1px solid "+S.green+"44",borderRadius:6,padding:"10px",fontSize:12,color:S.green,textAlign:"center"}}>✓ Pay looks correct — no shortfall found.</div>
                )}
              </div>
            )}
            {!(cr.period||"").trim() && <div style={{marginTop:8,fontSize:10.5,color:S.amber}}>* Enter period number to generate claim text.</div>}
          </div>
        );
      })}

      <div onClick={addClaimRound} style={{background:S.panel,border:"1px dashed "+S.cyan+"66",color:S.cyan,padding:"12px 0",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:13,textAlign:"center",marginBottom:14}}>+ Add Another Round</div>
    </>);
  }

  // PASTE VIEW
  if (view==="paste") return wrap(<>
    {topBar("ADD DAY", ()=>setView("period"))}

    <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"14px"}}>
      <div style={{fontWeight:700,marginBottom:6,color:S.cyan}}>📋 Paste Manifest Text</div>
      <div style={{fontSize:11,color:S.muted,marginBottom:10,lineHeight:1.5}}>Open your Manifest Summary in the courier app, select &amp; copy all the text (including the Day Summary), then paste it here.</div>
      <textarea rows={12} value={pasteText} onChange={e=>setPasteText(e.target.value)}
        placeholder={"Round Number: 123456\nManifest Date: 01/01/2026\nSmall Packet: 30\nPacket: 10\n...\nSuccessful deliveries: 150\nCarry forward: 5\nCannot deliver: 0"} />
      {parseError && <div style={{color:S.red,fontSize:11,marginTop:8}}>{parseError}</div>}
      <Btn color="cyan" onClick={doParse} style={{marginTop:10}}>PARSE →</Btn>
    </div>
  </>);

  // CONFIRM VIEW
  if (view==="confirm" && parsed) {
    let totalAmount=0;
    (parsed.manifests||[]).forEach(m=>{totalAmount+=calcRound(m.round_number,m.parcels,rateConfig).total;});
    const knownRounds = Object.keys(rateConfig.rounds||{});
    const hasRate = rn => knownRounds.includes(String(rn));
    const unknownRounds = (parsed.manifests||[]).map(m=>m.round_number).filter(rn=>!hasRate(rn));
    const blockSave = unknownRounds.length>0;
    return wrap(<>
      {topBar("CONFIRM DATA", ()=>setView("paste"))}
      {blockSave && (
        <div style={{background:S.red+"18",border:"1px solid "+S.red+"66",borderRadius:8,padding:"12px 14px",marginBottom:12,fontSize:12.5,lineHeight:1.6}}>
          <div style={{color:S.red,fontWeight:700,marginBottom:4}}>⚠ Round not set up: {unknownRounds.join(", ")}</div>
          <div style={{color:S.text}}>This round has no rate, so pay shows £0.00. Check the number is correct, or add it in Settings first.</div>
          {knownRounds.length>0 && <div style={{color:S.muted,marginTop:6}}>Your rounds in Settings: {knownRounds.join(", ")}</div>}
        </div>
      )}
      <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:13}}>
          <span>📅 <b>{parsed.date}</b></span>
          {parsed.distance_miles && <span style={{color:S.cyan}}>🚐 {parsed.distance_miles}mi</span>}
          {parsed.duration_hours!=null && <span style={{color:S.cyan}}>⏱ {parsed.duration_hours}h {parsed.duration_minutes}m</span>}
        </div>
      </div>
      {(parsed.manifests||[]).map((m,i)=>{
        const {total,lines}=calcRound(m.round_number,m.parcels,rateConfig);
        return (
          <div key={i} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <b style={{fontSize:14}}>Round {m.round_number}</b>
              <span style={{color:S.amber,fontWeight:700}}>{fmt(total)}</span>
            </div>
            {!hasRate(m.round_number) && <div style={{color:S.red,fontSize:11,marginBottom:8}}>⚠ No rate set for this round</div>}
            {lines.filter(l=>l.count>0).map((l,j)=>(
              <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:S.text}}>{l.type} <span style={{color:S.cyan}}>×{l.count}</span></span>
                <span style={{color:S.muted}}>£{l.rate.toFixed(2)} = <b style={{color:S.amber}}>£{l.sub.toFixed(2)}</b></span>
              </div>
            ))}
            {lines.filter(l=>l.count>0).length===0 && <div style={{color:S.red,fontSize:11}}>⚠ No parcel counts found</div>}
          </div>
        );
      })}
      {(() => {
        const combined={};let grandCount=0;
        (parsed.manifests||[]).forEach(m=>Object.entries(m.parcels).forEach(([type,count])=>{if(count>0){combined[type]=(combined[type]||0)+count;grandCount+=count;}}));
        if(Object.keys(combined).length===0) return null;
        return (
          <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontWeight:700,marginBottom:8,display:"flex",justifyContent:"space-between"}}>
              <span>All Rounds Combined</span>
              <span style={{color:S.muted,fontSize:12}}>total {grandCount}</span>
            </div>
            {Object.entries(combined).map(([type,count],j)=>(
              <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                <span style={{color:S.text}}>{type}</span><span style={{color:S.cyan}}>×{count}</span>
              </div>
            ))}
          </div>
        );
      })()}
      {parsed.day_summary && (
        <div style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:12,fontSize:12}}>
          <div style={{fontWeight:700,marginBottom:6}}>Day Summary</div>
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <span style={{color:S.green}}>✓ {parsed.day_summary.successful}</span>
            <span style={{color:S.amber}}>CF {parsed.day_summary.carry_forward}</span>
            <span style={{color:S.red}}>✗ {parsed.day_summary.cannot_deliver}</span>
            {parsed.day_summary.successful_collections>0 && (
              <span style={{color:S.cyan}}>📦 Collections {parsed.day_summary.successful_collections}</span>
            )}
          </div>
        </div>
      )}
      <div style={{background:S.panel,borderRadius:8,padding:"12px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:S.muted}}>Total Earnings</span>
        <span style={{color:S.amber,fontWeight:700,fontSize:20}}>{fmt(totalAmount)}</span>
      </div>
      {blockSave
        ? <>
            <div style={{background:S.panel,border:"1px solid "+S.border,opacity:0.5,color:S.muted,padding:"13px 0",borderRadius:7,textAlign:"center",fontWeight:700,fontSize:14,marginBottom:10}}>✓ SAVE (fix round first)</div>
            <div onClick={()=>setView("settings")} style={{background:S.cyan,color:"#000",padding:"12px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"center"}}>⚙ Go to Settings to add the round</div>
          </>
        : <Btn color="green" onClick={saveDay}>✓ SAVE</Btn>}
    </>);
  }

  // DAY DETAIL
  if (view.startsWith("day_") && activePeriod) {
    const di=parseInt(view.split("_")[1]);
    const d=activePeriod.days[di];
    if(!d){setView("period");return null;}
    return wrap(<>
      {topBar("📅 "+d.date, ()=>setView("period"))}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <Stat label="Manifest" value={d.manifested} />
        <Stat label="Delivered" value={d.successful} color={S.green} />
        <Stat label="CF" value={d.carry_forward} color={S.amber} />
        <Stat label="Collection" value={d.successful_collections||0} color={S.cyan} />
        <Stat label="Earned" value={fmt(dayAmount(d,rateConfig))} color={S.amber} />
        {d.distance_miles>0 && <Stat label="Miles" value={d.distance_miles+"mi"} color={S.cyan} />}
        {d.duration_hours>0 && <Stat label="Drive" value={d.duration_hours+"h"+d.duration_minutes+"m"} color={S.cyan} />}
      </div>
      {(d.rounds||[]).map((r,i)=>{
        const live=calcRound(r.round,r.parcels,rateConfig);
        return (
        <div key={i} style={{background:S.card,border:"1px solid "+S.border,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <b>Round {r.round}</b><span style={{color:S.amber}}>{fmt(live.total)}</span>
          </div>
          {live.lines.map((l,j)=>(
            <div key={j} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:S.muted,marginBottom:3}}>
              <span>{l.type}</span>
              <span>{l.count} × £{l.rate.toFixed(2)} = <b style={{color:S.text}}>£{l.sub.toFixed(2)}</b></span>
            </div>
          ))}
        </div>
      );})}
    </>);
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
